# Keep deps current without flooding CI (first Dependabot wave opened ~15 PRs).
# Prefer grouped PRs; keep open PR limits low so Actions runners stay free for product PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /shareout-app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      # One PR for runtime deps, one for dev tooling — not one PR per package.
      production-deps:
        dependency-type: production
      development-deps:
        dependency-type: development
      # Still group known-coupled stacks when they land as mixed updates.
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - wrangler
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
          - "@cloudflare/vitest-pool-workers"

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docs
    groups:
      docs-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
