# Keep deps current without flooding the PR list (the first Dependabot wave opened ~15
# PRs): grouped updates, low open-PR limits. npm only: there is no hosted CI and there are
# no workflows, so no GitHub Actions to update. Check a Dependabot PR locally before
# merging it (MAINTAINING.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /shareout-app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      # One PR for runtime deps, one for dev tooling — not one PR per package.
      production-deps:
        dependency-type: production
      development-deps:
        dependency-type: development
      # Still group known-coupled stacks when they land as mixed updates.
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - wrangler
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
          - "@cloudflare/vitest-pool-workers"

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docs
    groups:
      docs-deps:
        patterns:
          - "*"
