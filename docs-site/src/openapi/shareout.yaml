                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        ref: { type: string }
                        name: { type: string }
                        kind: { type: string, enum: [folder, drive, site, group] }
                        selectable: { type: boolean }
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{workspaceId}/file-imports/sources:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [File imports]
      summary: Import a folder
      description: >-
        Creates the import and starts its first run. The picked folder becomes a
        ShareOut folder inside `targetFolderId` (or at the top level), mirroring
        subfolders. Files take the target folder's visibility (private → private,
        public → link-shareable, otherwise team); converted pages are never public.
        At most 10 folders per workspace can sync daily.
      operationId: createFileImportSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, ref]
              properties:
                provider: { type: string, enum: [google_drive, microsoft] }
                ref: { type: string, description: A selectable ref from browse. }
                name: { type: string }
                targetFolderId: { type: string, nullable: true }
                convert: { type: boolean, default: true, description: Turn Word/Excel/PDF/Markdown/CSV (and slides, when the converter is bound) into pages. }
                dailySync: { type: boolean, default: false }
      responses:
        "201":
          description: Created and started
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { $ref: "#/components/schemas/FileImportSource" }
                  run: { $ref: "#/components/schemas/FileImportRun" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{workspaceId}/file-imports/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - { name: sourceId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [File imports]
      summary: Change daily sync or conversion
      operationId: updateFileImportSource
      requestBody:
