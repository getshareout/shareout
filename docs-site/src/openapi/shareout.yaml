          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Updated
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/catalog/seed:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Catalog]
      summary: Seed catalog from workspace connectors
      operationId: seedWorkspaceCatalog
