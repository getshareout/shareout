                        size:
                          type: integer
                        is_entry:
                          type: boolean
                        updated_by:
                          type: [string, "null"]
                        updated_at:
                          type: string
                          format: date-time
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Workspaces]
      summary: Set the entry file
      description: Owner/admin. Also accepts PATCH. `null` or empty resets to `index.md`.
      operationId: setWorkspaceContextEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: [string, "null"]
      responses:
        "200":
          description: "`{ entry }`"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/context/{name}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: name
        in: path
        required: true
        description: Lowercase file name ending in `.md` (max 64 chars).
        schema:
          type: string
    get:
      tags: [Workspaces]
      summary: Read a guidance file
      operationId: getWorkspaceContextFile
      responses:
        "200":
          description: The markdown
          content:
            text/markdown:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Workspaces]
      summary: Create or replace a guidance file
      description: "Owner/admin. Also accepts POST. Raw markdown body or JSON `{ \"content\": \"...\" }`; max 64KB, 100 files."
      operationId: putWorkspaceContextFile
      requestBody:
        required: true
        content:
          text/markdown:
            schema:
              type: string
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: "`{ name, size, updated: true }`"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Workspaces]
      summary: Delete a guidance file
      description: Owner/admin.
      operationId: deleteWorkspaceContextFile
      responses:
        "200":
          description: "`{ name, deleted: true }`"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/audit:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: Workspace audit log
      description: Owner/admin. Newest first. No offset/cursor — only the most recent `limit` entries.
      operationId: getWorkspaceAudit
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        ts:
                          type: string
                          format: date-time
                        actor_id:
                          type: [string, "null"]
                        actor_email:
                          type: [string, "null"]
                        action:
                          type: string
                        target_type:
                          type: [string, "null"]
                        target_id:
                          type: [string, "null"]
                        detail:
                          description: Parsed JSON detail, or null.
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/tokens:
    get:
      tags: [Tokens]
      summary: List my API tokens
      description: Metadata only — a token's plaintext is never recoverable.
      operationId: listMyTokens
      responses:
        "200":
          description: Tokens (unpaginated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: [string, "null"]
                        created_at:
                          type: string
                        last_used_at:
                          type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Tokens]
      summary: Create an API token
      description: >-
        Mints a personal token, returned once. Body optional; `{ "regenerate": true }` first
        revokes all of the caller's existing tokens.
      operationId: createMyToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                regenerate:
                  type: boolean
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  token:
                    type: string
                  shown_once:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me/tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Tokens]
      summary: Revoke one of my API tokens
      operationId: revokeMyToken
      responses:
        "200":
          description: "Revoked (`{ ok: true }`)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/features:
    get:
      tags: [Account]
      summary: Which features are enabled
      description: >-
        Feature introspection for agents. Scope: `artifact_id` (caller needs access) →
        that artifact's workspace; else `workspace_id` (caller must be a member); else the
        host workspace on a workspace subdomain, else personal scope.
      operationId: getFeatures
      parameters:
        - name: workspace_id
          in: query
          schema:
            type: string
        - name: artifact_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Effective flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: object
                    properties:
                      workspace_id:
                        type: [string, "null"]
                  features:
                    type: object
                    additionalProperties:
                      type: boolean
                  disabled:
                    type: array
                    items:
                      type: string
                  catalog:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        label:
                          type: string
                        category:
                          type: string
                        description:
                          type: string
                        enabled:
                          type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/file-imports:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [File imports]
      summary: Configured drives, my connections, and imported folders
      operationId: getFileImports
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    description: Only providers this instance has client ids for. Empty = feature hidden.
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [google_drive, microsoft] }
                        connected: { type: boolean }
                        accountEmail: { type: string, nullable: true }
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileImportSource"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/file-imports/connect/{provider}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google_drive, microsoft]
    get:
      tags: [File imports]
      summary: Start the read-only file consent
      description: >-
        Redirects (302) to Google or Microsoft. The consent returns to
        `GET /v1/file-imports/oauth/{provider}/callback`, which stores the encrypted
        tokens for the signed-in member in this workspace and posts
        `shareout:file-import:connected` to the opener window.
      operationId: connectFileImport
      responses:
        "302":
          description: Redirect to the provider's consent screen
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/file-imports/oauth/{provider}/callback:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google_drive, microsoft]
      - { name: code, in: query, schema: { type: string } }
      - { name: state, in: query, schema: { type: string } }
    get:
      tags: [File imports]
      summary: OAuth redirect URI (browser only)
      description: Signed state + PKCE; the session user must be the user who started the flow. Returns an HTML page.
      operationId: fileImportOAuthCallback
      responses:
        "200":
          description: Connected (HTML)
        "400":
          description: Refused or expired (HTML)
  /v1/workspaces/{workspaceId}/file-imports/connections/{provider}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google_drive, microsoft]
    delete:
      tags: [File imports]
      summary: Disconnect my drive
      description: >-
        Deletes my consent (and revokes it at Google). Every folder syncing through it
        stops: running imports end with `CONNECTION_REVOKED`, daily sync turns off.
        Imported files stay.
      operationId: disconnectFileImport
      responses:
        "200":
          description: Disconnected
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/file-imports/browse/{provider}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google_drive, microsoft]
      - name: ref
        in: query
        description: Opaque ref from a previous browse (`root` to start).
        schema: { type: string, default: root }
      - name: q
        in: query
        description: Search SharePoint sites (Microsoft, at `root`).
        schema: { type: string }
    get:
      tags: [File imports]
      summary: Browse my drive's folders
      operationId: browseFileImport
      responses:
