openapi: 3.1.0
info:
  title: ShareOut REST API
  version: "1.0"
  summary: Publish, serve, and manage live web artifacts.
  description: |
    The ShareOut REST API lets you publish HTML artifacts, manage versions and
    collaborators, store data and files, and schedule jobs — all over HTTPS.

    **Base URL:** `https://shareout.site`

    All write endpoints require a bearer token. Store yours in
    `~/.shareout/credentials` as `{ "token": "so_..." }`.

    > Heads up: ShareOut sits behind Cloudflare. Python `requests` can trip a
    > `1010` block — build your JSON in Python and pipe it to `curl` instead.
  contact:
    name: ShareOut
    url: https://shareout.site
servers:
  - url: https://shareout.site
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Publish
    description: Create and update artifacts.
  - name: Artifacts
    description: Read, list, and manage artifacts.
  - name: Search
    description: Ranked fuzzy search across pages, folders, data, people, schedules, crew, and alerts.
  - name: Collaborators
    description: Share editing access and transfer ownership.
  - name: Access requests
    description: Viewers request access to private artifacts; owners approve or deny.
  - name: Support
    description: Customer support tickets across in-app, email, Slack, and Telegram.
  - name: Favorites
    description: Per-user starred artifacts.
  - name: Data
    description: Per-artifact JSON and table storage.
  - name: Blobs
    description: File storage (images, video, documents).
  - name: Jobs
    description: Scheduled and event-driven tasks.
  - name: Folders
    description: Organize artifacts into personal and Team Space folders.
  - name: Knowledge
    description: Per-workspace learned knowledge — notes, search, entities.
  - name: Tokens
    description: Self-serve personal API tokens.
  - name: Assets
    description: Per-scope asset library — versioned deliverables, collections, and client download links.
  - name: File imports
    description: >-
      Import folders from Google Drive and OneDrive / SharePoint into workspace files.
      A separate read-only consent per member and workspace; workspace owners, admins and
      (while members may create folders) members only. Tokens are never returned.
  - name: External sharing
    description: Client orgs, external members, folder grants, scoped tokens, read receipts, and client notes (Teams/Enterprise).
  - name: Metric alerts
    description: Followable metrics and threshold alert rules.
  - name: Templates
    description: Reusable email templates with variables.
  - name: Account
    description: Plan tier, upgrades, and feature introspection.
  - name: Auth
    description: CLI device login and token exchange (no bearer required).
  - name: Home
    description: Signed-in home feed, activity visibility, and analytics helpers.
  - name: Billing
    description: Workspace subscriptions, trials, and payment methods.
  - name: Workspaces
    description: Teams workspaces, members, subdomains, connectors, and data catalog.
  - name: Catalog
    description: Optional per-workspace data map — sources, lineage, glossary.
  - name: Instance admin
    description: Instance-owner operations (`INSTANCE_ADMIN_EMAILS`) across every workspace.
paths:
  /v1/publish:
    post:
      tags: [Publish]
      summary: Publish an artifact
      description: >-
        Create a new artifact or push a new version of an existing one. Every
        `files[].path` must be a safe relative path (see `FileEntry.path`); an unsafe
        one returns 400 `INVALID_PATH` with a `hint` naming it.
      operationId: publishArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
            examples:
              minimal:
                summary: Single HTML file
                value:
                  name: My App
                  slug: my-app
                  entrypoint: index.html
                  visibility: public
                  files:
                    - path: index.html
                      content: "<!DOCTYPE html><h1>Hello</h1>"
                      mime: text/html
                      encoding: utf8
      responses:
        "201":
          description: >-
            Published. Check `visibility` — when it is more private than asked,
            `visibility_downgraded` is true and `notice` says why; tell the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Storage limit reached (`STORAGE_LIMIT_EXCEEDED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/search:
    get:
      tags: [Search]
      summary: Ranked fuzzy search
      description: >-
        Typo-tolerant search across pages, folders, datasets, connectors, people,
        schedules, crew, and alerts. Same engine as the Home Cmd+K palette. Personal
        tokens may pass `workspace` to scope; workspace Agent tokens (`sot_`) are
        pinned to their workspace and require `artifacts:read`.
      operationId: searchWorkspace
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search text. Empty returns recents.
        - name: groups
          in: query
          schema:
            type: string
          description: >-
            Comma subset of artifacts,folders,datasets,connectors,people,schedules,crew,alerts.
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 25
          description: Max results per group.
        - name: workspace
          in: query
          schema:
            type: string
          description: Workspace id to scope (personal tokens only).
      responses:
        "200":
          description: Grouped search hits
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
                  folders:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
                  datasets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
                  connectors:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
                  people:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
                  schedules:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
                  crew:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/ask:
    post:
      tags: [Search]
      summary: Ask your workspace (single-turn Q&A)
      description: >-
        Read-only answer over pages the caller can access. Same access scope as search.
        Triggered from Home Cmd+K when the query ends with `?`.
      operationId: askWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                workspace:
                  type: string
                  description: Workspace id to scope (optional for personal context).
      responses:
        "200":
          description: Answer with page citations
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        artifact_id:
                          type: string
                        title:
                          type: string
                        url:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/metric-watch:
    get:
      tags: [Metric alerts]
      summary: List metric watches on an artifact
      operationId: listMetricWatches
      parameters:
        - name: artifact_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Watches for the artifact
          content:
            application/json:
              schema:
                type: object
                properties:
                  watches:
                    type: array
                    items:
                      $ref: "#/components/schemas/MetricWatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Metric alerts]
      summary: Create a metric watch
      description: One-click table watch — bell-only anomaly alerts (±threshold_pct vs baseline).
      operationId: createMetricWatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricWatchCreate"
      responses:
        "201":
          description: Watch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  watch:
                    $ref: "#/components/schemas/MetricWatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/metric-watch/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Metric alerts]
      summary: Delete a metric watch
      operationId: deleteMetricWatch
      responses:
        "200":
          description: Watch removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/artifacts:
    get:
      tags: [Artifacts]
      summary: List artifacts
      operationId: listArtifacts
      parameters:
        - name: favorites
          in: query
          description: Return only the current user's favorited artifacts.
          schema:
            type: boolean
        - name: workspace_id
          in: query
          description: >-
            List artifacts that belong to a workspace (not the caller's personal
            artifacts). Caller must be a workspace member (403 otherwise). Owners/admins
            see all workspace artifacts; members see non-private artifacts plus any they
            own or collaborate on.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: count
          in: query
          description: Set `true` to include an exact `total` (extra query).
          schema:
            type: boolean
      responses:
        "200":
          description: A list of artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
                  has_more:
                    type: boolean
                  total:
                    type: integer
                    description: Only with `count=true`.
                  limit:
                    type: integer
                  offset:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/artifacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifacts]
      summary: Get an artifact
      description: >-
        The path also accepts the artifact's slug. Any signed-in caller who can view
        the artifact gets its details; `can_edit`, `can_delete` and `can_manage_comments`
        say which writes the API will accept from this caller.
      operationId: getArtifact
      responses:
        "200":
          description: The artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Artifacts]
      summary: Update artifact metadata
      description: >-
        Update visibility, name, social link-preview fields, or anonymous-access
        opt-ins. When instance policy holds public visibility the write still
        succeeds with 202 `VISIBILITY_HELD` (or `MODERATION_HELD` while an automated
        safety check runs) and the page stays private for now.
      operationId: updateArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                visibility:
                  $ref: "#/components/schemas/Visibility"
                allow_anon_write:
                  type: boolean
                  description: Let anonymous visitors mutate json/tables/blobs/datasets on public artifacts.
                allow_anon_email:
                  type: boolean
                  description: Let anonymous visitors send contact-form email.
                allow_anon_agent:
                  type: boolean
                  description: Let anonymous visitors use the in-artifact AI chat agent.
                allow_anon_collab:
                  type: boolean
                  description: Let anonymous visitors join realtime collaboration.
                social_title:
                  type: [string, "null"]
                social_description:
                  type: [string, "null"]
                social_image_url:
                  type: [string, "null"]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Artifacts]
      summary: Delete an artifact (soft delete)
      description: >-
        Soft delete with a 30-day recovery window — not an immediate purge. The
        artifact is hidden from listings and stops serving, and its routing slug is
        freed for re-publish, but its files, versions, and data store are kept so it
        can be restored via `POST /v1/artifacts/{id}/restore` until the window
        elapses (a daily sweep hard-purges it after that). Caller must be the
        artifact owner, or a workspace owner/admin when the artifact is
        workspace-owned (`owner_id` is null).
      operationId: deleteArtifact
      responses:
        "200":
          description: Moved to trash
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: string
                    description: Artifact id
                  deleted_at:
                    type: string
                    format: date-time
                  recoverable_until:
                    type: string
                    format: date-time
                    description: After this time the artifact is permanently purged.
                  retention_days:
                    type: integer
                    example: 30
                  restore_url:
                    type: string
                  message:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/artifacts/{id}/export:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifacts]
      summary: Export artifact as zip
      description: >-
        One-click portability — published source files plus json keys and table CSVs.
        Owner or workspace admin only.
      operationId: exportArtifact
      responses:
        "200":
          description: Zip bundle
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/artifacts/{id}/present:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifacts]
      summary: Present this — AI-generate a slides deck
      description: >-
        Reads production HTML and publishes a new private slides artifact in the same
        workspace. Rate-limited per user.
      operationId: presentArtifact
      responses:
        "200":
          description: New deck artifact
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact_id:
                    type: string
                  url:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Rate limit exceeded
  /v1/artifacts/unused/archive:
    post:
      tags: [Artifacts]
      summary: Archive all unused personal pages
      description: >-
        Soft-delete flagged never-viewed pages (janitor). Personal account owner only.
        Batches of 100 per call.
      operationId: archiveUnusedPersonalArtifacts
      responses:
        "200":
          description: Archive result
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/artifacts/{id}/presence:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifacts]
      summary: Live concurrent viewer count
      description: >-
        Best-effort count of viewers with the artifact page open (visible tab).
        Owner or collaborator only — not shown on the public page.
      operationId: getArtifactPresence
      responses:
        "200":
          description: Current viewer count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    minimum: 0
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/artifacts/{id}/deliver:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifacts]
      summary: Deliver channel status
      description: >-
        Per-channel connection status for the Home Inspector Deliver section —
        whether Telegram is linked for the signed-in user, Slack is connected for
        the artifact workspace (with OAuth `connectUrl` when not), email is
        always available (with the caller's own address), and the caller's role.
      operationId: getArtifactDeliverStatus
      responses:
        "200":
          description: Channel status
          content:
            application/json:
              schema:
                type: object
                properties:
                  telegram:
                    type: object
                    properties:
                      linked:
                        type: boolean
                      connectUrl:
                        type: string
                  slack:
                    type: object
                    properties:
                      available:
                        type: boolean
                      connected:
                        type: boolean
                      connectionName:
                        type: [string, "null"]
                      connectUrl:
                        type: [string, "null"]
                  email:
                    type: object
                    properties:
                      available:
                        type: boolean
                      address:
                        type: [string, "null"]
                        description: The signed-in user's own email — the default recipient.
                  role:
                    type: string
                    enum: [owner, editor, viewer]
                    description: >-
                      Caller's role on the artifact. Viewers may only schedule or
                      deliver to themselves (own email, own Telegram, Slack DM).
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Artifacts]
      summary: Deliver artifact now
      description: >-
        One-shot delivery to email, Slack, or Telegram — same destination registry
        as scheduled jobs (`action` + `config`). Viewers may only deliver to
        themselves on Slack/Telegram.
      operationId: deliverArtifactNow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, config]
              properties:
                action:
                  type: string
                  enum: [email, slack, telegram]
                config:
                  type: object
                  description: Same shape as job `config` for the chosen action.
      responses:
        "200":
          description: Delivery succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  steps:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: Delivery failed
  /v1/artifacts/{id}/deliver/slack-channels:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifacts]
      summary: List Slack channels for Deliver picker
      description: >-
        Searchable channel list for the workspace Slack connection — used by Home
        Inspector Deliver instead of pasting channel IDs.
      operationId: listArtifactDeliverSlackChannels
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                  error:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/artifacts/deleted:
    get:
      tags: [Artifacts]
      summary: List soft-deleted artifacts (trash)
      description: >-
        Soft-deleted artifacts still inside the 30-day recovery window that the
        caller can restore (their own, plus workspace-owned ones where they are an
        owner/admin). Each entry includes `deleted_at` and `recoverable_until`.
      operationId: listDeletedArtifacts
      responses:
        "200":
          description: Trash contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items:
                      type: object
                  retention_days:
                    type: integer
                    example: 30
  /v1/artifacts/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifacts]
      summary: Restore a soft-deleted artifact
      description: >-
        Bring a trashed artifact back. Allocates a fresh routing + display slug
        (suffixed if the original was reclaimed by a re-publish while it was
        trashed), recreates the production deployment from the latest version, and
        returns the artifact detail. Caller must be the owner, or a workspace
        owner/admin. Only works inside the 30-day window — after that the artifact is
        permanently purged.
      operationId: restoreArtifact
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          description: Artifact is not deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Artifact has no version to restore
  /v1/artifacts/{id}/rollback:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifacts]
      summary: Re-point production at an older version (deprecated)
      deprecated: true
      description: >-
        Deprecated: use `POST /v1/artifacts/{id}/versions/{no}/restore`, which creates a
        new version with the old files and keeps the history. This endpoint only moves
        the production pointer and creates no version. Responses carry a `Deprecation`
        header. Editor or owner.
      operationId: rollbackArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version_no:
                  type: integer
                version_id:
                  type: string
      responses:
        "200":
          description: Production now serves that version
          headers:
            Deprecation:
              description: RFC 9745 deprecation date.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deployed_version:
                    type: integer
                  version_id:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No production deployment to roll back
  /v1/artifacts/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifacts]
      summary: List published versions
      description: >-
        The 50 newest published versions, newest first, with who published each one,
        how (`source`), its change note (`message` / `message_source`), the size of its
        entrypoint, how many comment threads were written on it and who approved it.
        `live_version_id` is the version production serves. Viewer or above.
      operationId: listArtifactVersions
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/VersionSummary"
                  live_version_id:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/artifacts/{id}/versions/{versionNo}/source:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
      - name: versionNo
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Artifacts]
      summary: Read one version's source
      description: >-
        The entrypoint text of one version, for a diff or a preview. `content` is capped
        at 512 KB (`truncated: true` past that). Viewer or above.
      operationId: getArtifactVersionSource
      responses:
        "200":
          description: Version source
          content:
            application/json:
              schema:
                type: object
                properties:
                  version_no:
                    type: integer
                  entrypoint:
                    type: string
                  mime:
                    type: string
                  size_bytes:
                    type: integer
                  content:
                    type: string
                  truncated:
                    type: boolean
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`VERSION_NOT_FOUND`, or `ASSET_NOT_FOUND` when its files are gone"
        "415":
          description: "`NOT_TEXT` — the entrypoint is binary"
  /v1/artifacts/{id}/versions/{versionNo}/restore:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
      - name: versionNo
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [Artifacts]
      summary: Restore an older version (non-destructive)
      description: >-
        Creates a new version (`latest_version + 1`, `source: restore`) with the files of
        version `versionNo` and makes it live, or stages it when blocking tests are on.
        Every earlier version stays in the history. Replaces the deprecated
        `POST /v1/artifacts/{id}/rollback`. Editor or owner.
      operationId: restoreArtifactVersion
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 500
                  description: Change note for the new version.
      responses:
        "201":
          description: Restored as a new version
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  version_id:
                    type: string
                  version_no:
                    type: integer
                  restored_from_version_no:
                    type: integer
                  staged:
                    type: boolean
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Artifact not found, or `VERSION_NOT_FOUND`"
        "409":
          description: "`CONFLICT` (someone published at the same moment) or `ASSET_NOT_FOUND` (that version has no files)"
  /v1/artifacts/{id}/files:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifacts]
      summary: Get artifact files
      description: >-
        Fetch the files of an artifact version (the live one unless `version` is given).
        Requires viewer access or higher. `manifest=1` lists path, mime, size and sha256
        without any content; `paths` reads only the files named. Before editing, read the
        files you change and pass `version_no` as `base_version` to
        `POST /v1/artifacts/{id}/edits`.
      operationId: getArtifactFiles
      parameters:
        - name: version
          in: query
          description: Version number or ID. Defaults to the live (production) version.
          schema:
            type: string
        - name: manifest
          in: query
          description: "`1`: return `[{path, mime, size, sha256}]` only, from the database (no file content)."
          schema:
            type: string
            enum: ["1"]
        - name: paths
          in: query
          description: >-
            Comma-separated paths (or repeat the parameter) to read only those files. A path
            the version lacks is a 404 `FILE_NOT_FOUND` listing it under `missing`.
          schema:
            type: string
          example: index.html,styles.css
      responses:
        "200":
          description: Files for the version
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact_id:
                    type: string
                  version_id:
                    type: string
                  version_no:
                    type: integer
                  entrypoint:
                    type: string
                  live_version:
                    type: integer
                    nullable: true
                    description: "`manifest=1` only: the version live in production."
                  newest_version:
                    type: integer
                    nullable: true
                    description: >-
                      `manifest=1` only: the newest saved version — the `base_version` an edit
                      needs. Ahead of `live_version` while a version waits on blocking tests.
                  files:
                    type: array
                    description: With `manifest=1`, ManifestEntry items; otherwise FileEntry items with content.
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/FileEntry"
                        - $ref: "#/components/schemas/ManifestEntry"
                  unreadable:
                    type: array
                    items:
                      type: string
                    description: Files of the version whose stored bytes could not be read (absent when none).
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/artifacts/{id}/edits:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifacts]
      summary: Edit artifact files
      description: >-
        Change an artifact with small operations instead of re-publishing every file.
        The ops run in order on the newest version, which `base_version` must name; if
        any op fails nothing is written. The result is published as the next version
        through the normal publish pipeline (moderation, tests gate, readiness), and
        files the ops leave unchanged are carried over without re-uploading. Counts once
        against the daily publish limit (`dry_run` does not). Requires the editor role.
        Works on html, markdown, csv, txt and json artifacts. Workspace Agent tokens need
        `artifacts:publish` and reach only artifacts in their own workspace. Renaming or
        deleting the mobile entrypoint turns the artifact's mobile view off. Send
        `Idempotency-Key` to make retries safe.
      operationId: editArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditRequest"
            example:
              base_version: 3
              message: Blue headings
              ops:
                - op: replace
                  path: styles.css
                  old: "h1 { color: red; }"
                  new: "h1 { color: blue; }"
      responses:
        "201":
          description: >-
            Saved as a new version. Same body as `POST /v1/publish`, plus `base_version`
            and `changes`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact:
                    type: object
                  version:
                    type: object
                    properties:
                      id:
                        type: string
                      version_no:
                        type: integer
                  deployment:
                    type: object
                  visibility:
                    $ref: "#/components/schemas/Visibility"
                  base_version:
                    type: integer
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileChange"
        "200":
          description: >-
            `dry_run: true` (`{dry_run, base_version, would_create_version, entrypoint,
            changes}`), or ops that leave every file as it was (`{unchanged: true}`): no
            version is created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run:
                    type: boolean
                  unchanged:
                    type: boolean
                  base_version:
                    type: integer
                  would_create_version:
                    type: integer
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileChange"
        "400":
          description: Malformed request (`VALIDATION_ERROR`, `INVALID_OPS`, `INVALID_PATH`, `INVALID_JSON`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`VERSION_CONFLICT`: the artifact has a newer version than `base_version`; `current_version` says which. Nothing was written."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      base_version:
                        type: integer
                      current_version:
                        type: integer
        "413":
          description: "`STORAGE_LIMIT_EXCEEDED` or `FILE_TOO_LARGE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            An op could not be applied; nothing was written. `EDIT_NO_MATCH` (`old` not
            found; `nearest` is the closest line), `EDIT_AMBIGUOUS` (`old` matches several
            places; `lines` lists them — add context or set `all`), `FILE_NOT_FOUND`,
            `FILE_EXISTS`, `NOT_TEXT`, `RENAME_CHANGES_TYPE`, `ENTRYPOINT_MISSING`,
            `UNSUPPORTED_ARTIFACT_TYPE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/artifacts/{id}/collaborators:
