  /v1/workspaces/{workspaceId}/catalog/manifest:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Catalog]
      summary: Catalog adoption manifest
      operationId: getWorkspaceCatalogManifest
      responses:
        "200":
          description: KPIs, orphans, dangling refs
  /v1/workspaces/{workspaceId}/catalog/lineage:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Catalog]
      summary: Full lineage graph
      operationId: getWorkspaceCatalogLineage
      responses:
        "200":
          description: Nodes and edges
  /v1/workspaces/{workspaceId}/catalog/entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: entryId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Catalog]
      summary: Get one catalog entry
      operationId: getWorkspaceCatalogEntry
      description: >-
        The entry (accepts an alias of its id) with its effective `status`, the
        `certification` overlay, upstream/downstream neighbors read from both ends of
        every edge, and the certification `history` (newest first).
      responses:
        "200":
          description: Entry with upstream/downstream neighbors and certification history
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/catalog/entries/{entryId}/certify:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: entryId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Catalog]
      summary: Certify, revoke or deprecate a catalog entry
      operationId: certifyWorkspaceCatalogEntry
      description: >-
        Owner/admin in a signed-in browser session only: certification is a human act,
        so bearer tokens (personal, Agent, MCP) get 403 SESSION_REQUIRED. Records an
        append-only decision on the entry's current version (for kind metric, its
        normalized spec). The entry reads certified while its current version matches a
        certification made since the last revoke/deprecate; an edit shows it as changed
        since certification. Send the content_hash you reviewed to get 409 CONFLICT
        instead of deciding on a version you did not see.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [certified, revoked, deprecated]
                note:
                  type: string
                  maxLength: 1000
                content_hash:
                  type: string
                  description: certification.content_hash of the version you reviewed
      responses:
        "200":
          description: The new effective status, certification overlay and history
        "400":
          description: Invalid decision or note
        "403":
          description: FORBIDDEN (not an owner/admin) or SESSION_REQUIRED (a token, not a signed-in session)
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: CONFLICT (entry changed since content_hash) or CATALOG_DISABLED
  /v1/workspaces/{workspaceId}/catalog/files:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    put:
      tags: [Catalog]
      summary: Upsert a catalog markdown file
      operationId: upsertWorkspaceCatalogFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path:
                  type: string
                  maxLength: 200
                  description: Relative `.md` path of letters, digits, `.`, `_` and `-` (each name starting with a letter or digit), no `..`, at most 4 levels.
                  example: sources/orders.md
                content:
                  type: string
                  description: Markdown with YAML frontmatter, at most 128 KB (UTF-8).
      responses:
        "200":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Content larger than 128 KB (`FILE_TOO_LARGE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Catalog]
      summary: Delete a catalog file
      operationId: deleteWorkspaceCatalogFile
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /v1/workspaces/{workspaceId}/connections:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: List workspace connectors
      description: "No secrets are returned. Includes `credentialScope` and `hasMyCredentials`."
      operationId: listWorkspaceConnections
      responses:
        "200":
          description: Connectors
    post:
      tags: [Workspaces]
      summary: Create a workspace connector
      description: >-
        Admin+. Two kinds. **Generic** (`type`: `rest_api`, `bigquery`, `snowflake`;
        `credentials.type`: `api_key`, `basic_auth`, `service_account`). **Platform**
        (`kind: platform` + `provider`): the Connectors catalog — `s3`, `supabase`,
        `redshift`, `aurora`, `snowflake`, `bigquery`, `google-analytics`, `google-ads`,
        `facebook-ads`, `shopify`, `tiendanube`. Platform credential types: `aws_access_key`
        (`access_key_id`, `secret_access_key`, optional `session_token` — s3, redshift,
        aurora), `oauth` (`access_token` — supabase, shopify, tiendanube, facebook-ads),
        `key_pair` (snowflake), `service_account`, `authorized_user`. Per-provider `config`:
        s3 `bucket`, `region`, optional `prefix`, `endpoint`; supabase `project_ref` (ref or
        project URL); redshift `region`, `database` and one of `workgroup_name` /
        `cluster_identifier` (+ `db_user` or `secret_arn`); aurora `resource_arn`,
        `secret_arn`, `database`. `credentialScope`: `shared` (default) or `per_user`.
        Secrets are encrypted and never returned.
      operationId: createWorkspaceConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Letters, digits, `_` and `-`; max 64.
                kind:
                  type: string
                  enum: [generic, platform]
                  default: generic
                type:
                  type: string
                  description: Generic connectors only.
                  enum: [rest_api, bigquery, snowflake]
                provider:
                  type: string
                  description: "Platform connectors only (`kind: platform`)."
                  example: s3
                credentialScope:
                  type: string
                  enum: [shared, per_user]
                  default: shared
                authType:
                  type: string
                config:
                  type: object
                credentials:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [api_key, basic_auth, service_account, authorized_user, key_pair, oauth, aws_access_key]
                    data:
                      type: object
            examples:
              s3:
                value:
                  name: exports
                  kind: platform
                  provider: s3
                  config: { bucket: acme-exports, region: us-east-1, prefix: exports/ }
                  credentials: { type: aws_access_key, data: { access_key_id: AKIA..., secret_access_key: "..." } }
              supabase:
                value:
                  name: app-db
                  kind: platform
                  provider: supabase
                  config: { project_ref: "https://abcdefghijklmnopqrst.supabase.co" }
                  credentials: { type: oauth, data: { access_token: sbp_... } }
              redshift:
                value:
                  name: warehouse
                  kind: platform
                  provider: redshift
                  config: { region: us-east-1, database: dev, workgroup_name: analytics }
                  credentials: { type: aws_access_key, data: { access_key_id: AKIA..., secret_access_key: "..." } }
      responses:
        "200":
          description: Created
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/connections/test:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Workspaces]
      summary: Test connector credentials (no save)
      description: >-
        Admin+. Runs the provider's verifyConnection probe on unsaved credentials
        before creating a connector.
      operationId: testWorkspaceConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, credentials]
              properties:
                provider:
                  type: string
                  description: "Any platform provider id, e.g. `s3`, `supabase`, `redshift`, `aurora`, `google-analytics`. Same `config` and `credentials` shape as create."
                  example: s3
                config:
                  type: object
                credentials:
                  type: object
      responses:
        "200":
          description: Credentials verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/connections/{connectionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Workspaces]
      summary: Update a workspace connector
      description: Admin+. Currently supports toggling `agent_query_enabled` for the workspace assistant.
      operationId: updateWorkspaceConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_query_enabled:
                  type: boolean
      responses:
        "200":
          description: Updated
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspace/{workspaceId}/agent/chat:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Workspaces]
      summary: Workspace assistant chat (SSE)
      description: >-
        Stream a workspace-scoped assistant reply. Requires session or bearer token,
        workspace membership, and the `ai.web_agent` feature flag.
      operationId: workspaceAgentChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "200":
          description: SSE stream (`text/event-stream`)
        "404":
          description: Assistant not enabled for this workspace
        "429":
          description: Rate limited
  /v1/workspace/{workspaceId}/agent/confirm:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Workspaces]
      summary: Confirm a workspace assistant action
      operationId: workspaceAgentConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Action executed
        "410":
          description: Confirmation token expired
  /v1/workspaces/{workspaceId}/features:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: List workspace feature flags
      description: Any member may read. Feature flags are read-only to normal users.
      operationId: getWorkspaceFeatures
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                type: object
  /v1/workspaces/{workspaceId}/publish-policy:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: Get workspace publish policy
      operationId: getWorkspacePublishPolicy
      responses:
        "200":
          description: Current policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy:
                    type: string
                    enum: [allow, prohibit, require_approval]
                  approvalsRequired:
                    type: integer
    patch:
      tags: [Workspaces]
      summary: Set workspace publish policy
      operationId: setWorkspacePublishPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policy:
                  type: string
                  enum: [allow, prohibit, require_approval]
                approvals_required:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        "200":
          description: Updated
  /v1/workspaces/{workspaceId}/publish-approvals:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: List publish approval requests
      operationId: listWorkspacePublishApprovals
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: pending
      responses:
        "200":
          description: Approval queue
  /v1/workspaces/{workspaceId}/agent-tokens:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: List workspace Agent tokens (service accounts)
      description: >
        Lists the workspace's Agent (service-account) tokens — metadata only, plaintext
        is never recoverable. Owner/admin only.
      operationId: listAgentTokens
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        scopes:
                          type: array
                          items: { type: string, enum: [artifacts:read, artifacts:publish, data:read, data:write] }
                        principal_user_id: { type: string }
                        created_at: { type: string }
                        last_used_at: { type: string, nullable: true }
                        expires_at: { type: string, nullable: true }
                        revoked: { type: boolean }
        "403":
          description: Caller is not a workspace owner/admin
    post:
      tags: [Workspaces]
      summary: Mint a workspace Agent token
      description: >
        Mints a non-human, workspace-scoped Agent token (prefix `sot_`). Creates a
        headless service principal and adds it as a first-class workspace member that
        owns the artifacts it publishes. Plaintext token is returned exactly once.
        Owner/admin only.
      operationId: createAgentToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                  description: Human label, e.g. "CI bot".
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [artifacts:read, artifacts:publish, data:read, data:write] }
                expires_at:
                  type: string
                  nullable: true
                  description: Optional ISO datetime; omit for no expiry.
      responses:
        "201":
          description: Token minted (plaintext shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  token: { type: string, example: "sot_…" }
                  shown_once: { type: boolean }
                  token_id: { type: string }
                  principal_user_id: { type: string }
                  scopes:
                    type: array
                    items: { type: string }
        "400":
          description: Missing name or invalid scopes
        "403":
          description: Caller is not a workspace owner/admin
  /v1/workspaces/{workspaceId}/agent-tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: tokenId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Workspaces]
      summary: Revoke a workspace Agent token
      description: >
        Soft-revokes the token (sets revoked_at). The Agent principal keeps its
        artifacts; mint a new token to re-enable it. Owner/admin only.
      operationId: revokeAgentToken
      responses:
        "200":
          description: Revoked
        "403":
          description: Caller is not a workspace owner/admin
        "404":
          description: Token not found or already revoked
  /v1/skills/recommended:
    get:
      tags: [Workspaces]
      summary: List official Recommended by ShareOut skills
      description: >
        Curated official skills for the Library strip. Workspace-agnostic —
        any signed-in user (all plans). Read-only; maintained by ShareOut daily sync.
      operationId: listRecommendedSkills
      responses:
        "200":
          description: Official skill cards
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills:
                    type: array
                    items:
                      type: object
                      required: [slug, artifact_id, name, summary, category, tags, uses, url, official]
                      properties:
                        slug:
                          type: string
                        artifact_id:
                          type: string
                        name:
                          type: string
                        summary:
                          type: string
                        category:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        attribution:
                          type: string
                          nullable: true
                        uses:
                          type: integer
                        url:
                          type: string
                          format: uri
                        official:
                          type: boolean
                          enum: [true]
  /v1/workspaces/{workspaceId}/skills:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Workspaces]
      summary: Publish a new skill from markdown
      description: >
        Same publish as `POST /v1/publish` with `artifact_type: "skill"`, in the shape a
        form or an agent can send. Visibility is forced to `workspace`; the skill starts
        on the workspace's default edit policy.
      operationId: createWorkspaceSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, markdown]
              properties:
                name:
                  type: string
                markdown:
                  type: string
                slug:
                  type: string
                category:
                  type: string
      responses:
        "201":
          description: Skill published
        "409":
          description: Slug already used in this workspace
    get:
      tags: [Workspaces]
      summary: Browse skill marketplace catalog
      operationId: listWorkspaceSkills
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [top, trending, new, installs]
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
        - name: cursor
          in: query
          description: Opaque `next_cursor` from the previous page.
          schema:
            type: string
      responses:
        "200":
          description: Skill cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      type: object
                  sort:
                    type: string
                  next_cursor:
                    type: [string, "null"]
  /v1/workspaces/{workspaceId}/skills/categories:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: List skill categories
      operationId: listSkillCategories
      responses:
        "200":
          description: Categories
  /v1/workspaces/{workspaceId}/skills/installed:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: List skills saved by the current user
      operationId: listInstalledSkills
      responses:
        "200":
          description: Saved skills
  /v1/skills/{skillId}/markdown:
    parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Workspaces]
      summary: Raw SKILL.md for in-Studio viewer
      operationId: getSkillMarkdown
      responses:
        "200":
          description: Skill markdown body
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill_artifact_id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  markdown:
                    type: string
        "404":
          description: Skill not found or not visible
  /v1/workspaces/{workspaceId}/skills/index.json:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: Agent-installable catalog of the workspace's skills
      description: >
        The workspace catalog in the agentskills.io discovery shape, so a client that
        already reads `/.well-known/agent-skills/index.json` needs no new parser. Each
        entry links to `/v1/skills/{skillId}/raw`.
      operationId: getWorkspaceSkillsIndex
      responses:
        "200":
          description: Discovery document
  /v1/workspaces/{workspaceId}/skill-policy:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    put:
      tags: [Workspaces]
      summary: Set the default edit policy for new skills
      description: Workspace owner or admin only. Existing skills keep their own policy.
      operationId: setWorkspaceSkillPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [default_skill_edit_policy]
              properties:
                default_skill_edit_policy:
                  type: string
                  enum: [owner_only, workspace, approval]
      responses:
        "200":
          description: Updated
  /v1/skills/install.sh:
    get:
      tags: [Workspaces]
      summary: Installer script for a workspace's skills
      description: >
        POSIX shell script that writes a workspace's skills where an agent looks
        (`~/.claude/skills`, `.cursor/rules`, or a directory). Public: it carries no
        data and authenticates with the caller's own token at run time. Re-run it to
        re-sync.
      operationId: getSkillInstaller
      responses:
        "200":
          description: Shell script
          content:
            text/x-shellscript:
              schema:
                type: string
  /v1/skills/{skillId}/raw:
    parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Workspaces]
      summary: The skill as a markdown file
      description: >
        `text/markdown` with normalized Agent Skills frontmatter (`name`,
        `description`), so the bytes register with a client as-is. Official skills are
        readable without a token; workspace skills need membership.
      operationId: getSkillRaw
      responses:
        "200":
          description: Skill markdown
          content:
            text/markdown:
              schema:
                type: string
        "401":
          description: Authentication required for a workspace skill
  /v1/skills/{skillId}/policy:
    parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Workspaces]
      summary: Set who may change this skill
      description: Skill owner or workspace admin only.
      operationId: setSkillEditPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edit_policy]
              properties:
                edit_policy:
                  type: string
                  enum: [owner_only, workspace, approval]
      responses:
        "200":
          description: Updated
  /v1/skills/{skillId}/changes:
    parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Workspaces]
      summary: List proposed changes to a skill
      operationId: listSkillChanges
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, merged, rejected, withdrawn]
      responses:
        "200":
          description: Change requests
    post:
      tags: [Workspaces]
      summary: Propose a change to a skill
      description: >
        Any workspace member may propose. Nothing is applied until an approver merges,
        which republishes the skill as an ordinary new version.
      operationId: proposeSkillChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markdown]
              properties:
                markdown:
                  type: string
                title:
                  type: string
                note:
                  type: string
      responses:
        "201":
          description: Change request opened
  /v1/skills/{skillId}/changes/{changeId}:
    parameters:
      - name: skillId
        in: path
        required: true
        schema:
          type: string
      - name: changeId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Workspaces]
      summary: Read one proposed change, with the current body to compare against
      operationId: getSkillChange
      responses:
        "200":
          description: Change request
    post:
      tags: [Workspaces]
      summary: Merge, reject or withdraw a proposed change
      description: >
        `merge` and `reject` need the skill's owner, an artifact editor or a workspace
        admin. `withdraw` is the proposer's own call.
      operationId: reviewSkillChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [merge, reject, withdraw]
                review_note:
                  type: string
      responses:
        "200":
          description: Reviewed
  /v1/workspaces/{workspaceId}/agent-skills:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: List skills attached to my agent
      description: Scope is workspace id or `__personal` for personal Home chat. Max 8 per user.
      operationId: listAgentSkills
      responses:
        "200":
          description: Attached agent skills
    post:
      tags: [Workspaces]
      summary: Attach a skill to my agent
      operationId: attachAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_artifact_id]
              properties:
                skill_artifact_id:
                  type: string
      responses:
        "200":
          description: Attached
        "409":
          description: Limit reached or already attached
  /v1/workspaces/{workspaceId}/agent-skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: skillId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Workspaces]
      summary: Detach a skill from my agent
      operationId: detachAgentSkill
      responses:
        "200":
          description: Detached
  /v1/artifacts/{id}/publish-approval:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifacts]
      summary: Request publish approval
      operationId: createPublishApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility:
                  type: string
                  enum: [public]
                approver_ids:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Request created
  /v1/artifacts/{id}/publish-approval/{requestId}/decision:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
      - name: requestId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Artifacts]
      summary: Approve or reject a publish request
      operationId: decidePublishApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
      responses:
        "200":
          description: Decision recorded
  /v1/artifacts/{id}/skill/vote:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifacts]
      summary: Upvote a skill
      operationId: voteSkill
      responses:
        "200":
          description: Voted
    delete:
      tags: [Artifacts]
      summary: Remove skill upvote
      operationId: unvoteSkill
      responses:
        "200":
          description: Vote removed
  /v1/artifacts/{id}/skill/install:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifacts]
      summary: Save skill to My Skills
      operationId: installSkill
      responses:
        "200":
          description: Saved
    delete:
      tags: [Artifacts]
      summary: Remove skill from My Skills
      operationId: uninstallSkill
      responses:
        "200":
          description: Removed
  /v1/artifacts/{id}/skills:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifacts]
      summary: List skills attached to an artifact
      operationId: listAttachedSkills
      responses:
        "200":
          description: Attached skills
    post:
      tags: [Artifacts]
      summary: Attach a skill to an artifact
      operationId: attachSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skill_artifact_id:
                  type: string
                position:
                  type: integer
      responses:
        "200":
          description: Attached
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "ShareOut API token (`so_...`) from ~/.shareout/credentials."
  parameters:
    ArtifactId:
      name: id
      in: path
      required: true
      description: Artifact ID (e.g. `art_abc123`).
      schema:
        type: string
    DataArtifactId:
      name: artifactId
      in: path
      required: true
      description: Artifact ID (e.g. `art_abc123`).
      schema:
        type: string
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace ID or slug.
      schema:
        type: string
  responses:
    RecentSearches:
      description: The recent searches in the scope, newest first
      content:
        application/json:
          schema:
            type: object
            properties:
              searches:
                type: array
                items:
                  type: object
                  properties:
                    q:
                      type: string
                    at:
                      type: string
                      format: date-time
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Slug taken or version conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: >-
        Rate limit reached (`RATE_LIMIT_EXCEEDED` on publish / account creation / AI
        routes, `RATE_LIMITED` on the data plane). Wait for `Retry-After` / `reset`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: >-
        Unexpected server failure. Retry once; if it fails again, file a ticket with
        `POST /v1/support/tickets` quoting `request_id`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ProvisionSummary:
      type: object
      properties:
        ok:
          type: boolean
        created:
          type: boolean
        workspace:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
            locale: { type: string }
        links:
          type: object
          properties:
            home: { type: string }
            admin: { type: string }
            subdomain: { type: [string, "null"] }
            instance_admin: { type: string }
        admins:
          type: array
          items:
            type: object
            properties:
              email: { type: string }
              role: { type: string, enum: [owner, admin, member] }
              status: { type: string, enum: [invited, already_invited, active, added, failed] }
              email_sent: { type: boolean }
              invite_url: { type: string, description: Only when the invite email did not go out. }
              error: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              step: { type: string, description: "workspace, branding, policy, folders, admins, connector:<name>, templates, custom_domain" }
              status: { type: string, enum: [created, updated, unchanged, skipped, pending, failed] }
              detail: { type: object }
              error: { type: string }
              next_step: { type: string }
        next_steps:
          type: array
          items: { type: string }
        duration_ms:
          type: integer
    FileImportRun:
      type: object
      properties:
        id: { type: string }
        sourceId: { type: string }
        status: { type: string, enum: [queued, walking, importing, done, stopped, failed] }
        trigger: { type: string, enum: [manual, resync, schedule] }
        counts:
          type: object
          properties:
            found: { type: integer }
            imported: { type: integer }
            converted: { type: integer }
            skipped: { type: integer }
            unchanged: { type: integer }
            failed: { type: integer }
        stopCode:
          type: string
          nullable: true
          description: STORAGE_QUOTA_EXCEEDED, CONNECTION_REVOKED, RATE_LIMITED, WALK_LIMIT (warning on a done run), NOT_ALLOWED, SOURCE_DELETED, STALLED, FAILED.
        stopMessage: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        errors:
          type: array
          description: Files that failed, were skipped, or imported with a warning (up to 200).
          items:
            type: object
            properties:
              path: { type: string }
              status: { type: string }
              code: { type: string }
              message: { type: string }
    FileImportSource:
      type: object
      properties:
        id: { type: string }
        provider: { type: string, enum: [google_drive, microsoft] }
        remoteName: { type: string }
        targetFolderId: { type: string, nullable: true }
        targetFolderName: { type: string, nullable: true }
        convert: { type: boolean }
        dailySync: { type: boolean }
        nextSyncAt: { type: string, nullable: true }
        connected: { type: boolean, description: false after the connection was revoked. }
        mine: { type: boolean }
        lastRun: { $ref: "#/components/schemas/FileImportRun" }
    Visibility:
      type: string
      description: "'unlisted' was retired 2026-07 — still accepted as input and treated as 'public'."
      enum: [public, workspace, private]
    Role:
      type: string
      enum: [owner, editor, viewer]
    Error:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
          description: Human-readable message.
        code:
          type: string
          description: Machine-readable error code.
        request_id:
          type: string
          description: Correlation id (also the `X-Request-Id` header). Quote it in support tickets.
        reason:
          type: string
          description: >-
            Finer cause under `code`. For `UNAUTHORIZED`: missing, invalid, revoked or expired.
        hint:
          type: string
          description: What to do next, in plain words.
        suggestion:
          type: string
        param:
          type: string
          description: The request field at fault.
        docs:
          type: string
          description: Doc page for this error.
        redirect_url:
          type: string
        support:
          type: object
          description: Present on 5xx — how to reach a human.
          properties:
            how:
              type: string
              example: POST /v1/support/tickets
            include:
              type: array
              items:
                type: string
              example: [request_id]
      required: [success, error, code]
    SearchHit:
      type: object
      properties:
        kind:
          type: string
          enum: [artifact, folder, dataset, connector, person, schedule, crew, alert]
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        slug:
          type: string
        artifactType:
          type: string
        views:
          type: integer
        owner:
          type: string
        thumb:
          type: string
        avatar:
          type: string
        badge:
          type: string
        score:
          type: number
    FileEntry:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          maxLength: 512
          example: img/logo@2x.png
          description: >-
            Relative path with "/" between folders. No "..", no leading "/", no backslash,
            no empty or "." segments (e.g. "a//b", "./x"), no control characters, at most
            512 characters. An unsafe path is rejected with 400 `INVALID_PATH`; the `hint`
            names it.
        content:
          type: string
        mime:
          type: string
        encoding:
          type: string
          enum: [utf8, base64]
        size_bytes:
          type: integer
    ManifestEntry:
      type: object
      properties:
        path:
          type: string
        mime:
          type: string
        size:
          type: integer
          description: Bytes.
        sha256:
          type: string
          description: Hex SHA-256 of the stored bytes.
    EditOp:
      type: object
      required: [op]
      description: >-
        `replace {path, old, new, all?}`: `old` must match exactly once unless `all`;
        both are literal text (`$&` stays `$&`). In a CRLF file an `old` written with LF
        still matches and the replacement takes CRLF. `write {path, content, encoding?}`
        creates or replaces a whole file (`encoding: base64` for binary). `delete {path}`.
        `rename {from, to}` moves a file without re-uploading it (same file type only).
      properties:
        op:
          type: string
          enum: [replace, write, delete, rename]
        path:
          type: string
        old:
          type: string
        new:
          type: string
        all:
          type: boolean
        content:
          type: string
        encoding:
          type: string
          enum: [utf8, base64]
        from:
          type: string
        to:
          type: string
    EditRequest:
      type: object
      required: [base_version, ops]
      properties:
        base_version:
          type: integer
          minimum: 1
          description: The `version_no` of the files you read; must be the newest version.
        ops:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/EditOp"
        message:
          type: string
          description: Note for the version history.
        dry_run:
          type: boolean
          description: Report `changes` without saving anything.
    FileChange:
      type: object
      properties:
        path:
          type: string
        change:
          type: string
          enum: [added, modified, deleted, renamed]
        from:
          type: string
          description: Old path of a renamed file.
        size_before:
          type: integer
        size_after:
          type: integer
        replacements:
          type: integer
    EditError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            op_index:
              type: integer
              description: Index in `ops` of the op that failed.
            path:
              type: string
            nearest:
              type: object
              description: "`EDIT_NO_MATCH`: the line most like the first line of `old`."
              properties:
                line:
                  type: integer
                text:
                  type: string
            lines:
              type: array
              description: "`EDIT_AMBIGUOUS`: 1-based line of each match (first 20)."
              items:
                type: integer
    PublishRequest:
      type: object
      required: [name, files]
      properties:
        name:
          type: string
          description: Display name.
        slug:
          type: string
          description: URL slug. Auto-generated if omitted.
        entrypoint:
          type: string
          default: index.html
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
        visibility:
          $ref: "#/components/schemas/Visibility"
        mobile_html:
          type: string
        pwa:
          $ref: "#/components/schemas/PWAConfig"
        access_policy:
          type: object
          description: >-
            Row-level access policy for per-viewer data filtering: `{ version: 1, field,
            default, rules, queries? }`. `queries` maps a name to `{ connection, provider,
            endpoint, params }` — the Data Platform queries scoped viewers may run.
        agent:
          $ref: "#/components/schemas/AgentConfig"
        message:
          type: string
          maxLength: 500
          description: >-
            Optional change note for this version, shown in the version history. When a
            new version is published without one, a short "what changed" note may be
            generated in the background (`message_source: ai`), unless the workspace
            turned off `ai.version_summaries`.
    PWAConfig:
      type: object
      properties:
        enabled:
          type: boolean
        name:
          type: string
        short_name:
          type: string
          maxLength: 12
        icon:
          type: string
          description: Data URL or absolute URL to a PNG icon.
    AgentConfig:
      type: object
      description: Turns on the visitor chat agent.
      properties:
        enabled:
          type: boolean
          default: true
        systemPrompt:
          type: string
        model:
          type: string
          example: claude-sonnet-5
        maxTokens:
          type: integer
        temperature:
          type: number
        contextJson:
          type: boolean
          default: true
        contextTables:
          type: array
          items:
            type: string
    PublishResponse:
      type: object
      properties:
        artifact:
          type: object
          properties:
            id:
              type: string
        version:
          type: object
          properties:
            id:
              type: string
            version_no:
              type: integer
        deployment:
          type: object
          properties:
            slug:
              type: string
            url:
              type: string
              format: uri
            subdomain_url:
              type: string
              format: uri
              description: >-
                Preferred share URL for workspace artifacts
                (https://{workspace}.shareout.site/{slug}/). Omitted for personal artifacts.
            mobile_url:
              type: string
              format: uri
        editor_readiness:
          type: object
          description: >-
            Advisory HTML editor-readiness profile (HTML artifacts only). Never blocks publishing.
          properties:
            manifest:
              type: string
              enum: [valid, invalid, missing]
            outline:
              type: boolean
            counts:
              type: object
              properties:
                pages:
                  type: integer
                bindings:
                  type: integer
                templates:
                  type: integer
            summary:
              type: object
              properties:
                errors:
                  type: integer
                warnings:
                  type: integer
                infos:
                  type: integer
            findings:
              type: array
              items:
                type: object
                properties:
                  rule:
                    type: string
                  level:
                    type: string
                  message:
                    type: string
                  suggestion:
                    type: string
                  disables:
                    type: string
        pwa:
          type: object
          properties:
            manifest_url:
              type: string
              format: uri
            installable:
              type: boolean
        visibility:
          $ref: "#/components/schemas/Visibility"
        visibility_downgraded:
          type: boolean
          description: >-
            True when the page came out more private than requested (instance
            policy, account without a verified email, public-artifact cap, or a
            moderation hold). A publish with no `visibility` counts as asking for public.
        requested_visibility:
          type: string
          enum: [public]
          description: Present with `visibility_downgraded`.
        notice:
          type: string
          description: Human-readable reason the publish was adjusted (governance, caps, email gate, instance policy).
        approval_required:
          type: object
          description: Present when workspace policy requires teammate approval before going open.
          properties:
            required:
              type: integer
              description: Number of approvers the requester must nominate.
            artifact_id:
              type: string
        moderation:
          type: object
          properties:
            status:
              type: string
              enum: [approved, pending, blocked]
            reason:
              type: string
            message:
              type: string
            requested_visibility:
              type: string
              enum: [public, workspace, private]
    Artifact:
      type: object
