  /v1/workspaces/{workspaceId}/catalog:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Catalog]
      summary: Search the data catalog
      description: >-
        Returns entries matching filters plus facet counts. Returns enabled false
        when the catalog is off.
      operationId: searchWorkspaceCatalog
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Effective status — certified only by an owner/admin decision on the current version.
          schema:
            type: string
            enum: [draft, certified, deprecated]
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search results
  /v1/workspaces/{workspaceId}/catalog/enable:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Catalog]
      summary: Enable or disable the catalog
      operationId: setWorkspaceCatalogEnabled
      description: >-
        Admin+. JSON body with enabled true (default) or enabled false.
      requestBody:
        required: true
