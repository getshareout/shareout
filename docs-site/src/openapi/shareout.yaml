  /v1/folders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Folders]
      summary: Rename or update a folder
      operationId: updateFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: [string, "null"]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Folders]
      summary: Delete a folder
      description: Artifacts inside the folder become unfiled.
      operationId: deleteFolder
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/artifacts/{id}/folder:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Folders]
      summary: Move an artifact into a folder
      description: "Pass `folder_id: null` to remove the artifact from its folder."
      operationId: moveArtifactToFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder_id]
              properties:
                folder_id:
                  type: [string, "null"]
      responses:
        "200":
          description: Moved
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/folders:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Folders]
      summary: List Team Space folders
      description: Top-level folders by default; `parent_id` lists one level below it, `all=1` returns every depth. Any member.
      operationId: listWorkspaceFolders
      parameters:
        - name: parent_id
          in: query
          schema:
            type: string
        - name: all
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Folders (unpaginated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Folder"
                  can_create:
                    type: boolean
                    description: Whether the caller may create folders in this workspace.
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Folders]
      summary: Create a Team Space folder
      description: Owners/admins always; members while the workspace setting `members_can_create_folders` is on (the default), otherwise 403 ADMIN_REQUIRED.
      operationId: createWorkspaceFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: Auto-generated from name if omitted.
                description:
                  type: string
                parent_id:
                  type: string
                readme:
                  type: string
                  description: Markdown folder guide.
                visibility:
                  type: string
                  enum: [inherit, public, workspace, private]
                  default: inherit
                  description: >-
                    A label for the folder, not enforced on its contents: each artifact
                    and file keeps its own visibility.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: parent_id not found (PARENT_NOT_FOUND)
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/workspaces/{workspaceId}/folders/by-path/{path}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: path
        in: path
        required: true
        description: Slash-separated folder slugs, e.g. `clients/acme`.
        schema:
          type: string
    get:
      tags: [Folders]
      summary: Get a Team Space folder by slug path
      operationId: getWorkspaceFolderByPath
      responses:
        "200":
          description: The folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/folders/{folderId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: folderId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Folders]
      summary: Get a Team Space folder
      operationId: getWorkspaceFolder
      responses:
        "200":
          description: The folder, with `path`, `readme` and `effective_visibility`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Folders]
      summary: Update a Team Space folder
      description: Also accepts PUT. Owners/admins for any folder; a member only for folders they created, while `members_can_create_folders` is on (otherwise 403 ADMIN_REQUIRED).
      operationId: updateWorkspaceFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: [string, "null"]
                readme:
                  type: string
                visibility:
                  type: string
                  enum: [inherit, public, workspace, private]
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Folders]
      summary: Delete a Team Space folder
      description: Owners/admins for any folder; a member only for folders they created, while `members_can_create_folders` is on (otherwise 403 ADMIN_REQUIRED). Artifacts become unfiled and subfolders move to the top level.
      operationId: deleteWorkspaceFolder
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/artifacts/{artifactId}/move:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: artifactId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Folders]
      summary: Move a workspace artifact into a Team Space folder
      description: "Pass `folder_id: null` to unfile it."
      operationId: moveWorkspaceArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder_id]
              properties:
                folder_id:
                  type: [string, "null"]
      responses:
        "200":
          description: Moved
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/knowledge:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Knowledge]
      summary: Knowledge settings and counts
      description: Returns `{enabled:false, ...}` when Knowledge is off. Any member.
      operationId: getKnowledge
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
                  lastUpdated:
                    type: [string, "null"]
                  total:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/knowledge/enable:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Knowledge]
      summary: Turn Knowledge on or off
      description: "Owner/admin. Body `{ \"enabled\": false }` turns it off; anything else turns it on."
      operationId: enableKnowledge
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: New state (`{ enabled }`)
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/knowledge/status:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Knowledge]
      summary: Learning progress (last 24h)
      operationId: getKnowledgeStatus
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  queued:
                    type: integer
                  processed:
                    type: integer
                  total:
                    type: integer
                  running:
                    type: boolean
                  lastProcessedAt:
                    type: [string, "null"]
                  corpus:
                    description: >-
                      Per-source corpus status (null when the corpus is not configured).
                      Owners, admins and instance admins see every source; members only
                      sources they may open.
                    type: [object, "null"]
                    properties:
                      chunker_version:
                        type: integer
                        description: Current chunker; sources with a lower one are re-learned overnight.
                      last_reindex_at:
                        type: [string, "null"]
                      counts:
                        type: object
                        properties:
                          queued: { type: integer }
                          ready: { type: integer }
                          failed: { type: integer }
                          unsupported: { type: integer }
                      sources:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            kind: { type: string, enum: [page, asset] }
                            title: { type: string }
                            status: { type: string, enum: [queued, ready, failed, unsupported] }
                            version: { type: string, description: Version (page) or blob (File) indexed }
                            chunker_version: { type: integer }
                            outdated: { type: boolean }
                            chunks: { type: integer }
                            chunks_with_page: { type: integer, description: Chunks on a sub-page of a multi-page site }
                            chunks_with_anchor: { type: integer, description: Chunks that deep-link to a section heading }
                            error: { type: [string, "null"] }
                            updated_at: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/knowledge/reindex:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Knowledge]
      summary: Re-learn the corpus, even at unchanged versions
      description: >-
        Owner/admin of the workspace, or an instance admin. Re-chunks every live,
        non-held page and File (or only `artifactIds`) with the current chunker, through
        the normal ingest path (metered the same way). Once per workspace per 10 minutes;
        at most 300 sources per call (`remaining` says how many are left).
      operationId: reindexKnowledge
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                artifactIds:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items: { type: string }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: integer }
                  remaining: { type: integer }
                  skipped:
                    type: array
                    description: Requested ids that are not live, eligible sources of this workspace
                    items: { type: string }
        "400":
          description: Bad body (`VALIDATION_ERROR`)
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Knowledge is off (`KNOWLEDGE_DISABLED`)
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/workspaces/{workspaceId}/knowledge/backfill:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Knowledge]
      summary: Queue existing pages and Files for learning
      description: Owner/admin.
      operationId: backfillKnowledge
      responses:
        "200":
          description: Queued counts (`queued`, `kicked`, `corpus`, `corpusRemaining`)
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/knowledge/tree:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Knowledge]
      summary: All knowledge notes grouped by kind (no bodies)
      operationId: getKnowledgeTree
      responses:
        "200":
          description: "`{ enabled, groups, count, issues }`"
  /v1/workspaces/{workspaceId}/knowledge/from/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: artifactId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Knowledge]
      summary: Knowledge notes learned from one artifact
      description: The reverse of a note's `sources`. Empty when the caller may not open the artifact (private to someone else, deleted, held, or in another workspace).
      operationId: getKnowledgeFromArtifact
      responses:
        "200":
          description: "`{ enabled, notes: [{ path, kind, id, title }] }`; `enabled: false` with no notes when Knowledge is off"
        "403":
          description: Not a member of the workspace
  /v1/workspaces/{workspaceId}/knowledge/files/{path}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: path
        in: path
        required: true
        description: Note path ending in `.md` (may contain slashes).
        schema:
          type: string
    get:
      tags: [Knowledge]
      summary: Read one knowledge note
      operationId: getKnowledgeFile
      responses:
        "200":
          description: "`{ enabled, node }` with body, `sources` (artifact ids) and `source_artifacts` (`{ id, slug, title, url, available }` per source; `url` is the absolute `<origin>/a/<slug>/` link; `available: false` with no title or url when the artifact is gone or not visible to the caller)"
        "404":
          description: Not found, or Knowledge is off
    put:
      tags: [Knowledge]
      summary: Write a knowledge note
      description: "Any member, except the overview `index.md`, which is owner/admin (it is loaded into every member's assistant). Send the markdown (with frontmatter `kind`, `id`, `title`) as `text/markdown`, or JSON `{ \"content\": \"...\" }`. Human edits win over learned ones. `kind: overview` and `id: index` are only accepted at `index.md`."
      operationId: putKnowledgeFile
      requestBody:
        required: true
        content:
          text/markdown:
            schema:
              type: string
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: "Saved (`{ ok, source: \"manual\" }`)"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Knowledge]
      summary: Delete a knowledge note
      description: Owner/admin. `forget=1` also stops it being re-learned.
      operationId: deleteKnowledgeFile
      parameters:
        - name: forget
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Deleted (`{ ok, forgotten }`)
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/knowledge/search:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Knowledge]
      summary: Search the workspace's Files and pages
      description: Cited passages. 409 KNOWLEDGE_DISABLED when off; 501 when the instance has no search index.
      operationId: searchKnowledge
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: format
          in: query
          description: "`md` returns text/markdown."
          schema:
            type: string
            enum: [md]
      responses:
        "200":
          description: "`{ query, ... }` results"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Knowledge is off (KNOWLEDGE_DISABLED)
  /v1/workspaces/{workspaceId}/knowledge/entities:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Knowledge]
      summary: List entities the workspace is about
      operationId: listKnowledgeEntities
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Entities, most-mentioned first
  /v1/workspaces/{workspaceId}/knowledge/entities/{entityId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: entityId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Knowledge]
      summary: One entity with facts, connections and evidence
      operationId: getKnowledgeEntity
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [md]
      responses:
        "200":
          description: The entity
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/knowledge/graph:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Knowledge]
      summary: Entity graph (nodes + edges)
      operationId: getKnowledgeGraph
      parameters:
        - name: focus
          in: query
          schema:
            type: string
        - name: depth
          in: query
          schema:
            type: integer
            default: 1
            maximum: 3
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 300
      responses:
        "200":
          description: Graph
  /v1/workspaces/{workspaceId}/knowledge/sources:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Knowledge]
      summary: Indexed sources
      operationId: listKnowledgeSources
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Sources
  /v1/workspaces/{workspaceId}/knowledge/usage:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Knowledge]
      summary: Knowledge cost for this workspace
      description: Owner/admin.
      operationId: getKnowledgeUsage
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
            maximum: 365
      responses:
        "200":
          description: Usage
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/context:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: List workspace guidance (context) files
      description: Any member. Markdown house rules an agent reads when working in the workspace.
      operationId: listWorkspaceContext
      responses:
        "200":
          description: Files (unpaginated, max 100)
          content:
            application/json:
              schema:
