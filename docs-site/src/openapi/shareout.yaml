  /v1/data/{artifactId}/comments:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
    get:
      tags: [Data]
      summary: List comments
      description: >-
        Comments on the artifact, newest first. Session cookie or Bearer token; the
        artifact's comment identity mode decides who may read. `403 COMMENTS_DISABLED`
        when comments are off for the artifact.
      operationId: listComments
      parameters:
        - name: contextId
          in: query
          schema:
            type: string
        - name: parentId
          in: query
          description: A comment id for its replies, or `null` for top-level threads only.
          schema:
            type: string
        - name: resolved
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: assignee
          in: query
          description: "`me` or an email: only action items assigned to them."
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      comments:
                        type: array
                        items:
                          $ref: "#/components/schemas/Comment"
                      count:
                        type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/data/{artifactId}/comments/_config:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
    get:
      tags: [Data]
      summary: Comments settings
      description: >-
        The artifact's comment settings plus `guestCommentsEffective` (its own guest setting,
        or the nearest folder's when it has none).
      operationId: getCommentsConfig
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/CommentsConfig"
    put:
      tags: [Data]
      summary: Change comments settings
      description: >-
        Artifact owner only. `guestComments: true` lets people with no account comment after
        an email code, wherever they can already open the page (public, or an unlocked
        password page); `false` turns it off; `null` follows the folder setting.
      operationId: setCommentsConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                identityMode: { type: string, enum: [anonymous, named, authenticated] }
                allowReplies: { type: boolean }
                maxDepth: { type: integer, minimum: 1, maximum: 10 }
                overlayEnabled: { type: boolean }
                guestComments: { type: [boolean, "null"] }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/CommentsConfig"
        "400":
          description: "`INVALID_REQUEST`"
        "403":
          description: "`FORBIDDEN` — not the owner"
  /v1/data/{artifactId}/comments/_guest:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
    get:
      tags: [Data]
      summary: Guest comment status
      description: Whether guests may comment here for this requester, and the signed-in guest's own name (never an email).
      operationId: getGuestStatus
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      guest:
                        type: [object, "null"]
                        properties:
                          name: { type: string }
    delete:
      tags: [Data]
      summary: Sign the guest out
      description: Clears the guest cookie. Must come from a page on this instance (`Origin`).
      operationId: guestSignOut
      security: []
      responses:
        "200":
          description: Signed out
        "403":
          description: "`FORBIDDEN` — foreign or missing Origin"
  /v1/data/{artifactId}/comments/_guest/code:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
    post:
      tags: [Data]
      summary: Email a guest comment code
      description: >-
        Emails a 6-digit code (valid 10 minutes) so a person with no account can comment as a
        guest. Only when guest comments are on and the requester can already open the page
        without an account (public, or a password page whose access cookie the request
        carries). Must come from a page on this instance (`Origin`). Limits: 10 per hour per
        IP, 6 per hour per address, 30 s between sends.
      operationId: guestSendCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
      responses:
        "200":
          description: "`{ success: true, data: { sent: true } }`"
        "400":
          description: "`VALIDATION_ERROR`"
        "403":
          description: "`GUEST_COMMENTS_DISABLED`, or `FORBIDDEN` (Origin)"
        "429":
          description: "`RATE_LIMIT_EXCEEDED`"
  /v1/data/{artifactId}/comments/_guest/verify:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
    post:
      tags: [Data]
      summary: Confirm a guest comment code
      description: >-
        Exchanges the code for `shareout_guest_{artifactId}`: an HttpOnly, SameSite=Strict
        cookie (12 h) holding an HMAC over the artifact id, the name and a keyed email hash,
        valid for this artifact only. Guests then post and reply through `POST …/comments`
        (`authorType: guest`); they cannot resolve, assign, react or approve. Five wrong
        tries burn a code.
      operationId: guestVerifyCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, code]
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: "`{ success: true, data: { guest: { name }, expiresIn } }` plus `Set-Cookie`"
        "400":
          description: "`INVALID_CODE` or `VALIDATION_ERROR`"
        "403":
          description: "`GUEST_COMMENTS_DISABLED`, or `FORBIDDEN` (Origin)"
        "429":
          description: "`RATE_LIMIT_EXCEEDED`"
  /v1/data/{artifactId}/comments/{commentId}/resolve:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
      - name: commentId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Data]
      summary: Resolve or reopen a comment
      description: >-
        Signed-in caller: the comment's author, the artifact owner, the assignee, or
        anyone with comment access — owner or collaborator (across linked accounts), an
        internal member of the artifact's workspace when it is workspace- or
        public-visible, or a `comment` grant. A view-only grant does not qualify.
      operationId: resolveComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resolved:
                  type: boolean
                  default: true
                  description: "`false` reopens the thread."
      responses:
        "200":
          description: The updated comment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Comment"
        "403":
          description: "`FORBIDDEN` (no comment access) or `COMMENTS_DISABLED`"
        "404":
          description: "`COMMENT_NOT_FOUND`"
  /v1/data/{artifactId}/comments/{commentId}/assign:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
      - name: commentId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Data]
      summary: Assign a comment (action item)
      description: >-
        Turns a thread into an action item for a workspace member or collaborator, or
        clears it with `assignee: null` (also clears `dueAt`). Same callers as resolve.
        The assignee is notified.
      operationId: assignComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee:
                  type: [string, "null"]
                  description: Email of a workspace member or collaborator.
                dueAt:
                  type: [string, "null"]
                  format: date-time
      responses:
        "200":
          description: The updated comment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Comment"
        "400":
          description: "`ASSIGNEE_NOT_FOUND` — not a workspace member or collaborator; `INVALID_REQUEST` for a bad dueAt"
        "403":
          description: "`FORBIDDEN` (no comment access) or `COMMENTS_DISABLED`"
        "404":
          description: "`COMMENT_NOT_FOUND`"
  /v1/data/{artifactId}/tables:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
    get:
      tags: [Data]
      summary: List tables
      operationId: listTables
      responses:
        "200":
          description: Tables for the artifact
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items:
                      type: string
  /v1/data/{artifactId}/workspace/_share:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
    post:
      tags: [Data]
      summary: Share one of this artifact's tables with the workspace (Teams)
      description: >-
        Owner-only. Exposes one of this artifact's tables to other artifacts in
        the same workspace at read or readwrite level. The data stays in this
        artifact's store; this only records an opt-in grant.
      operationId: shareWorkspaceTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table]
              properties:
                table:
                  type: string
                  description: Name of this artifact's table to share.
                as:
                  type: string
                  description: Workspace-unique shared name (defaults to the table name).
                access:
                  type: string
                  enum: [read, readwrite]
                  default: read
      responses:
        "200":
          description: Share created or updated
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/data/{artifactId}/workspace/tables/{sharedName}/query:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
      - name: sharedName
        in: path
        required: true
        description: The workspace-shared table name.
        schema:
          type: string
    post:
      tags: [Data]
      summary: Query a workspace-shared table (Teams)
      description: >-
        Read rows from a table another artifact shared into this workspace. Same
        query body as the per-artifact table query. Writing (insert/update/delete)
        is allowed only when the owner shared the table as readwrite.
      operationId: queryWorkspaceTable
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Matching rows
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/members/invite:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Workspaces]
      summary: Invite people by email (bulk)
      description: >-
        Owner or admin only. `emails` is an array or one string of pasted text — commas,
        semicolons, spaces, newlines, `Name <email>` and spreadsheet columns all work; tokens
        without `@` are ignored, duplicates collapse. Up to 100 valid addresses per call
        (`400 TOO_MANY_EMAILS` beyond that — batch). New or not-yet-active people get a
        7-day join link by email; people with an account are added and notified. Existing
        members keep their role (change roles with `POST /members`). Re-inviting a pending
        person retires their older links.
      operationId: inviteWorkspaceMembers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails:
                  oneOf:
                    - type: array
                      items: { type: string }
                    - type: string
                  example: "Ana <ana@example.com>, luis@example.com"
                role:
                  type: string
                  enum: [member, admin]
                  default: member
                message:
                  type: string
                  maxLength: 500
                  description: Optional personal note passed to the invite email.
      responses:
        "200":
          description: Per-email results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        email: { type: string }
                        code:
                          type: string
                          enum: [invited, added, already_member, invalid_email, domain_not_allowed]
                        status:
                          type: string
                          enum: [invited, added, updated, skipped]
                          description: Legacy status; prefer `code`.
                        email_sent:
                          type: boolean
                          description: For `invited` — whether the invite email went out.
                        invite_url:
                          type: string
                          description: Join link, present only when the email did not go out. Share it by hand.
                  summary:
                    type: object
                    additionalProperties: { type: integer }
                    description: Count per `code`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/invites:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [Workspaces]
      summary: List pending invites
      description: Owner or admin only. Newest unclaimed invite per person, with `email_status` (`sent`, `failed`, `skipped`, `link_only`), `email_sent_at`, `expired` and `role`.
      operationId: listWorkspaceInvites
      responses:
        "200":
          description: Pending invites
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: inviteId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Workspaces]
      summary: Revoke a pending invite
      description: Owner or admin only. Drops every pending link for that person and their pending membership.
      operationId: revokeWorkspaceInvite
      responses:
        "200":
          description: Revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/invites/{inviteId}/resend:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: inviteId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Workspaces]
      summary: Resend an invite, or mint a shareable link
      description: >-
        Owner or admin only. Mints a new join link and returns it as `inviteUrl`. Default
        (`notify: true`) emails it and expires the person's older links. `notify: false`
        only returns the link (nothing is emailed, older links keep working) — use it to
        share the invite in chat.
      operationId: resendWorkspaceInvite
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notify:
                  type: boolean
                  default: true
      responses:
        "200":
          description: New link
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  inviteUrl: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/shared-tables:
    get:
      tags: [Data]
      summary: List tables shared into a workspace (Teams)
      description: Any workspace member can list the shared-table catalog.
      operationId: listWorkspaceSharedTables
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared tables in the workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  viewerRole:
                    type: string
                  sharedTables:
                    type: array
                    items:
                      type: object
                      properties:
                        sharedName:
                          type: string
                        access:
                          type: string
                          enum: [read, readwrite]
                        ownerArtifactId:
                          type: string
                        ownerName:
                          type: string
                        sourceTable:
                          type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/data/{artifactId}/platform/{provider}/{endpoint}/execute:
    parameters:
      - name: artifactId
        in: path
        required: true
        schema:
          type: string
      - name: provider
        in: path
        required: true
        schema:
          type: string
        example: redshift
      - name: endpoint
        in: path
        required: true
        schema:
          type: string
        description: >-
          Provider endpoint id. SQL providers (`supabase`, `redshift`, `aurora`):
          `sql.query` with `params.body = { sql, maxRows? }` → `{ columns, rows }`. `s3`:
          `objects.list` (`params.queryParams.prefix`), `objects.get`
          (`params.queryParams.key`; CSV → `rows`, JSON → `data`, text → `text`, ≤ 10 MB),
          `objects.presign` (`params.body = { key, expiresIn? }` → signed URL). Snowflake:
          `statements.execute`; BigQuery: `jobs.query`.
        example: sql.query
    post:
      tags: [Data]
      summary: Run a platform connector endpoint
      description: >-
        Runs a workspace platform connector server-side; credentials never reach the
        caller. Allowed for the artifact owner and workspace members. Under a row-level
        access policy, a scoped viewer can only run a query declared in
        `access_policy.queries`, by `query` name; their `params` are ignored and the
        server binds their scope into the declared SQL (otherwise `403 SCOPE_REQUIRED`).
        Connection ids: `GET /v1/workspaces/{workspaceId}/connections` (any member), or
        `GET /v1/data/{artifactId}/platform/connections` (artifact owner).
      operationId: executePlatformEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connectionId:
                  type: string
                  description: Required unless `query` names a declared query (which fixes the connection).
                query:
                  type: string
                  description: Name of a query in the artifact's `access_policy.queries`.
                params:
                  type: object
                  properties:
                    body:
                      type: object
                    queryParams:
                      type: object
                    pathParams:
                      type: object
            example:
              connectionId: conn_abc123
              params: { body: { sql: "select region, sum(revenue) as revenue from sales group by 1" } }
      responses:
        "200":
          description: "`{ success, data, meta }` — `data` is the provider result."
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/data/{artifactId}/blobs:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
    get:
      tags: [Blobs]
      summary: List blobs
      operationId: listBlobs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Blobs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      blobs:
                        type: array
                        items:
                          $ref: "#/components/schemas/Blob"
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
  /v1/data/{artifactId}/blobs/upload:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
    post:
      tags: [Blobs]
      summary: Request an upload URL
      description: >-
        Step 1 of an upload. Returns an `uploadUrl`; PUT the raw file bytes to it within 15
        minutes. When `direct` is true (presigned storage URL, non-browser callers only), POST
        `confirmUrl` afterwards to record the blob; when false the PUT itself records it and
        returns the Blob (201). Limits: 50MB per file, 500MB and 1000 blobs per artifact.
      operationId: requestBlobUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, mimeType]
              properties:
                filename:
                  type: string
                mimeType:
                  type: string
                  description: image/*, video/*, audio/*, application/pdf, text/plain, text/csv, text/markdown.
                size:
                  type: integer
                  description: Bytes. Optional, enables early quota checks.
      responses:
        "201":
          description: Upload URL issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      uploadUrl:
                        type: string
                        format: uri
                      confirmUrl:
                        type: string
                        description: Present only when `direct` is true.
                      tokenId:
                        type: string
                      direct:
                        type: boolean
                      expiresAt:
                        type: string
                        format: date-time
                      maxSize:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: File too large or storage full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/data/{artifactId}/blobs/{tokenId}/confirm:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Blobs]
      summary: Confirm a direct upload
      description: Records the blob after a `direct` PUT. Idempotent.
      operationId: confirmBlobUpload
      responses:
        "201":
          description: Blob recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Blob"
        "200":
          description: Already confirmed
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/data/{artifactId}/blobs/storage:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
    get:
      tags: [Blobs]
      summary: Storage usage
      operationId: getBlobStorage
      responses:
        "200":
          description: Usage for this artifact
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      usedBytes:
                        type: integer
                      blobCount:
                        type: integer
                      maxBytes:
                        type: integer
                      maxBlobs:
                        type: integer
                      availableBytes:
                        type: integer
  /v1/data/{artifactId}/blobs/{blobId}:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
      - name: blobId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Blobs]
      summary: Get blob metadata
      operationId: getBlob
      responses:
        "200":
          description: Blob metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Blob"
                      - type: object
                        properties:
                          contentUrl:
                            type: string
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Blobs]
      summary: Delete a blob
      operationId: deleteBlob
      responses:
        "200":
          description: Deleted (`data.deleted` is true)
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/data/{artifactId}/blobs/{blobId}/content:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
      - name: blobId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Blobs]
      summary: Download blob bytes
      description: Media types render inline; everything else downloads as an attachment.
      operationId: getBlobContent
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/data/{artifactId}/blobs/{blobId}/download-url:
    parameters:
      - $ref: "#/components/parameters/DataArtifactId"
      - name: blobId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Blobs]
      summary: Get a download URL
      description: A short-lived presigned URL when configured (`direct`, `expiresIn` 300s), else the content route.
      operationId: getBlobDownloadUrl
      responses:
        "200":
          description: Download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                      direct:
                        type: boolean
                      expiresIn:
                        type: [integer, "null"]
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/files/{deliverableId}/content:
    parameters:
      - name: deliverableId
        in: path
        required: true
        description: Workspace file id (`dlv_…`)
        schema:
          type: string
    get:
      tags: [Assets]
      summary: Stream workspace file content (latest version)
      description: Cross-artifact file route. Enforces per-file visibility — private files require owner, workspace member, or a sharee grant.
      operationId: getFileContent
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      operationId: listJobs
      parameters:
        - name: artifact_id
          in: query
          description: >-
            Jobs on one artifact. Its owner and editors see the shared schedules plus
            their own personal deliveries (Slack DM, own email, own linked Telegram);
            other people's personal subscriptions stay hidden. Anyone else sees only
            their own jobs on it.
          schema:
            type: string
        - name: workspace_id
          in: query
          description: Without artifact_id, narrow your own jobs to one workspace.
          schema:
            type: string
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
    post:
      tags: [Jobs]
      summary: Create a job
      description: Schedule a recurring (cron) or event-driven task.
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
            examples:
              weeklyEmail:
                summary: Weekly email
                value:
                  artifact_id: art_abc123
                  action: email
                  trigger_type: cron
                  schedule: "0 9 * * 1"
                  config:
                    recipients: [team@company.com]
                    subject: Weekly report
                    includeArtifactLink: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: >-
            No access to the artifact, or a viewer scheduling delivery to someone
            other than themselves (viewers may only send to their own email,
            their own Telegram, or a Slack DM to themselves).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Jobs]
      summary: Get a job
      operationId: getJob
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Jobs]
      summary: Update a job
      description: Enable/pause, change schedule, title, description, or config.
      operationId: updateJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                  nullable: true
                description:
                  type: string
                  maxLength: 1000
                  nullable: true
                schedule:
                  type: string
                enabled:
                  type: boolean
                config:
                  type: object
      responses:
        "200":
          description: Updated
    delete:
      tags: [Jobs]
      summary: Delete a job
      operationId: deleteJob
      responses:
        "200":
          description: Deleted
  /v1/jobs/{id}/run:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Jobs]
      summary: Run a job now
      description: Trigger immediately without affecting the schedule.
      operationId: runJob
      responses:
        "200":
          description: Executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  execution:
                    type: object
  /v1/folders:
