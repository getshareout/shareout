        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolved:
          type: boolean
        resolvedBy:
          type: [string, "null"]
        resolvedAt:
          type: [string, "null"]
          format: date-time
        position:
          description: Pin position on the page, when the comment was placed as a pin.
        mentions:
          type: array
          items:
            type: string
        authorType:
          type: string
          enum: [human, agent, guest]
          description: "`guest` = a verified guest with no account (their email is never returned)."

        assigneeUserId:
          type: [string, "null"]
        assigneeEmail:
          type: [string, "null"]
        dueAt:
          type: [string, "null"]
          format: date-time
        versionId:
          type: [string, "null"]
          description: Id of the version that was live when the comment was written; null on older comments.
        reactions:
          type: object
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              mine:
                type: boolean
    ReviewState:
      type: object
      properties:
        live_version_id:
          type: [string, "null"]
        live_version_no:
          type: [integer, "null"]
        can_review:
          type: boolean
          description: Caller may resolve, assign and approve.
        approvals:
          type: array
          items:
            type: object
            properties:
              version_id:
                type: string
              version_no:
                type: integer
              user_id:
                type: string
              name:
                type: [string, "null"]
              email:
                type: [string, "null"]
              created_at:
                type: string
                format: date-time
        my_approvals:
          type: array
          description: Version ids the caller (any linked account) approved.
          items:
            type: string
    Grant:
      type: object
      properties:
        id:
          type: string
        subject_type:
          type: string
          enum: [sharee, external_user, guest]
        subject_id:
          type: string
          description: Sharee id, users.id, or for a `guest` grant the guest's email.
        resource_type:
          type: string
          enum: [folder, artifact, file]
        resource_id:
          type: string
        capability:
          type: string
          enum: [view, comment, create, edit]
        granted_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When access ends (share-with-a-person expiry); null = never. A lapsed grant is denied at read time.
        subject_label:
          type: string
          description: The person's email or the client's name (list endpoint).
    GrantCreate:
      type: object
      required: [subject_type, subject_id, resource_type, resource_id, capability]
      properties:
        subject_type:
          type: string
          enum: [sharee, external_user]
        subject_id:
          type: string
        resource_type:
          type: string
          enum: [folder, artifact, file]
        resource_id:
          type: string
        capability:
          type: string
          enum: [view, comment, create, edit]
    ShareeActivityList:
      type: object
      properties:
        activity:
          type: array
          items:
            type: object
            properties:
              sharee_id:
                type: string
              resource_type:
                type: string
              resource_id:
                type: string
              user_id:
                type: string
              viewed_at:
                type: string
                format: date-time
    WebhookPayload:
      type: object
      required: [event, artifact_id, timestamp, data]
      properties:
        event:
          type: string
          enum:
            - artifact.published
            - artifact.updated
            - artifact.deleted
            - data.changed
            - job.executed
            - job.failed
        artifact_id:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          description: Event-specific payload.
webhooks:
  artifactEvent:
    post:
      tags: [Jobs]
      summary: Outbound artifact webhook
      description: |
        ShareOut POSTs this payload to your endpoint for subscribed events.
        Configure delivery via the Jobs API (`action: webhook`) or artifact settings.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Acknowledge receipt with any 2xx.
