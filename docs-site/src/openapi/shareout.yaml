  /v1/workspaces/{workspaceId}/grants:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [External sharing]
      summary: List grants
      description: >-
        Workspace admins. A folder's manager (an admin, or the member who created it
        while members manage their folders) may also list the grants on that one folder
        with `resource_type=folder&resource_id=…`. Not gated on the external-sharing
        entitlement, so existing access can always be reviewed.
      operationId: listGrants
      parameters:
        - name: subject_id
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
            enum: [folder, artifact, file]
        - name: resource_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Grant"
    post:
      tags: [External sharing]
      summary: Create a grant
      description: >-
        Workspace admins, with the external-sharing entitlement
        (`403 EXTERNAL_SHARING_NOT_ENTITLED` otherwise).
      operationId: createGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workspaces/{workspaceId}/grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: grantId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [External sharing]
      summary: Revoke a grant
      description: >-
        Hard delete, effective within about a minute. Workspace admins, or the folder's
        manager for a grant on a folder. Not gated on the external-sharing entitlement,
        so access can always be removed.
      operationId: deleteGrant
      responses:
        "200":
          description: Revoked
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/share-person:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [External sharing]
      summary: Share a file or folder with one person by email
      description: >-
        Admin, or the folder's manager for a folder. Only the role is relaxed for a
        manager: every share needs the external-sharing entitlement (Teams/Enterprise,
        or the `collab.external_sharing` feature on self-host; `403
        EXTERNAL_SHARING_NOT_ENTITLED`) and an email the workspace's allowed domains or
        emails accept (`403 DOMAIN_NOT_ALLOWED`). Invites an
        external user if needed and mints an `external_user` grant; re-sharing is
        idempotent and replaces the expiry. For a folder, the invite email's join link
        carries `?folder=<id>` through sign-in and lands on `/shared?folder=<id>` (that
        folder's branded portal); an already-active person's email links there too.
        Returns 409 if the email is already an internal member. With `guest: true`
        (folders only) no account is created: a `guest` grant whose subject is the email
        itself, and an emailed link that opens the folder in a space-guest session. The
        guest can also open it from `/shared?folder=<id>` with an email code. They see that
        folder's subtree only, up to the capability; revoking or expiring the grant ends
        their session on the next request.
      operationId: shareWithPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, resource_type, resource_id]
              properties:
                email:
                  type: string
                  format: email
                resource_type:
                  type: string
                  enum: [file, folder]
                resource_id:
                  type: string
                capability:
                  type: string
                  enum: [view, comment]
                  default: view
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  description: Access ends this many days from now (UI presets 7/30/90). Wins over expires_at.
                expires_at:
                  type: string
                  description: ISO date-time (or YYYY-MM-DD = end of that day, UTC) when access ends. Omit both for no expiry; a re-share replaces the previous expiry.
                guest:
                  type: boolean
                  default: false
                  description: Folders only. Share as a guest with no account (subject_type `guest`); the person gets an emailed link instead of an invite.
      responses:
        "201":
          description: Grant created (idempotent re-share)
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant:
                    $ref: "#/components/schemas/Grant"
                  email:
                    type: string
                  guest:
                    type: boolean
                    description: Present and true for a guest share.
                  email_sent:
                    type: boolean
                    description: Guest shares only — whether the link email went out.
        "400":
          description: "`VALIDATION_ERROR` — bad email, resource, capability or expiry"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email is already an internal workspace member
