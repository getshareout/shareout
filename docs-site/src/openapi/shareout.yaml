  /v1/home/new:
    post:
      tags: [Home]
      summary: Create a blank document or one from a template
      description: >-
        The Studio "New" menu's no-AI path. Creates a private HTML document owned by
        the caller — blank or from a simple template (report, meeting notes, proposal)
        — and returns where to open it. Inside a workspace (subdomain or `workspace`
        query) the caller must be an internal member. Counts toward the daily publish
        limit and the storage cap. Agent (`sot_`) tokens are refused.
      operationId: createHomeDocument
      parameters:
        - name: workspace
          in: query
          schema:
            type: string
          description: Workspace id (ignored on a workspace subdomain, which pins it).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  enum: [blank, report, meeting, proposal]
                  default: blank
                lang:
                  type: string
                  enum: [en, es]
                  default: en
                  description: Language of the document's title and headings.
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  artifactId:
                    type: string
                  slug:
                    type: string
                  name:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Storage limit reached
        "429":
          description: Daily publish limit reached
  /v1/home/import:
    post:
      tags: [Home]
      summary: Import a dropped or pasted file as an artifact
      description: >-
        One-step import from the Studio Home. Publishes a document (HTML, CSV, Markdown,
        JSON, text, PDF, Word .docx/.doc/.odt, or a spreadsheet .xlsx/.xls/.ods), pasted HTML,
        or a Claude / ChatGPT / Gemini share link (best-effort fetch) as a private
        artifact in the current workspace and folder. Word files become Markdown and
        spreadsheets one CSV per sheet. Slide decks (.pptx/.ppt/.odp) become a PDF on
        instances with the optional LibreOffice converter (`SLIDES_CONVERTER`); without
        it they answer 422 `CONVERT_UNAVAILABLE`. All of these keep the original file for
        download and must be sent base64-encoded. Images, video and other files belong in Assets
        (`/v1/assets`). Inside a
        workspace the caller must be an internal member. Counts toward the daily
        publish limit and the storage cap. Agent (`sot_`) tokens are refused.
      operationId: importHomeArtifact
      parameters:
        - name: workspace
          in: query
          schema:
            type: string
          description: Workspace id (ignored on a workspace subdomain, which pins it).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: File name; its extension picks the artifact type.
                content:
                  type: string
                encoding:
                  type: string
                  enum: [utf8, base64]
                html:
                  type: string
                  description: Pasted HTML source.
                url:
                  type: string
                  description: A Claude, ChatGPT or Gemini share link.
                folder:
                  type: string
                  description: Folder id to publish into.
                lang:
                  type: string
                  enum: [en, es]
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  artifactId:
                    type: string
                  slug:
                    type: string
                  name:
                    type: string
                  type:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Folder not found
        "413":
          description: File too large, spreadsheet too large to convert, or storage limit reached
        "415":
          description: File type belongs in Assets
        "422":
          description: Share link could not be read (login wall or JS-rendered), or an Office file or slide deck could not be converted (`CONVERT_FAILED`, `CONVERT_TIMEOUT`, `CONVERT_UNAVAILABLE`)
        "429":
          description: Daily publish limit reached
