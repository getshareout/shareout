  /v1/auth/profile:
    get:
      tags: [Auth]
      summary: Who am I
      description: >-
        The account this API key belongs to. Call it first to check the key works;
        a 401 here means reconnect (see the error `hint`).
      operationId: getProfile
      responses:
        "200":
          description: The signed-in account
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: [string, "null"]
                  username:
                    type: [string, "null"]
                  name:
                    type: [string, "null"]
                  metadata:
                    type: object
                  created_at:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/device/start:
    post:
      tags: [Auth]
      summary: Start CLI device login
      description: >
        RFC-8628-style device authorization for CLI/agents. No auth required.
        Optional `expected_email` pre-selects the Google account and drives a
        mismatch warning on approval.
      operationId: startDeviceLogin
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_email:
                  type: string
                  format: email
                  description: Email the user expects to sign in as (e.g. invite address).
      responses:
        "201":
          description: Pending device authorization
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, verification_uri_complete, interval, expires_in]
                properties:
                  device_code:
                    type: string
                    description: Secret held by the CLI for polling.
                  user_code:
                    type: string
                    description: Short code shown in the browser (e.g. XXXX-XXXX).
                  verification_uri:
                    type: string
                    format: uri
                  verification_uri_complete:
                    type: string
                    format: uri
                  interval:
                    type: integer
                    description: Minimum poll interval in seconds.
                  expires_in:
                    type: integer
                    description: Seconds until the code expires.
  /v1/auth/device/token:
    post:
      tags: [Auth]
      summary: Poll device login for token
      description: >
        Poll with the `device_code` secret. Returns pending until the browser
        OAuth step completes, then delivers the `so_` token exactly once.
      operationId: pollDeviceLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code:
                  type: string
      responses:
        "200":
          description: Pending or approved
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, interval]
                    properties:
                      status:
                        type: string
                        enum: [pending]
                      interval:
                        type: integer
                  - type: object
                    required: [status, token, user_id]
                    properties:
                      status:
                        type: string
                        enum: [approved]
                      token:
                        type: string
                        description: Bearer token (so_…), shown once.
                      user_id:
                        type: string
                      warn:
                        type: string
                        description: Present when expected_email did not match signed-in email.
        "400":
          description: >-
            `error` is the RFC 8628 value (`expired_token`, `access_denied`,
            `invalid_grant`, `invalid_request`); `code` and `hint` say what happened
            and what to do next (usually: start a new login).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/home/activity-feed:
    get:
      tags: [Home]
      summary: Activity feed (Needs You + Pulse)
      description: >-
        Two-surface feed for the signed-in home. Actionable events appear as
        individual rows; ambient events as aggregated Pulse counts. Filter by
        `window` (`today`, `7d`, `30d`) and optional `workspace`.
      operationId: getHomeActivityFeed
      parameters:
        - name: workspace
          in: query
          schema:
            type: string
          description: Workspace id or slug; omit for Personal scope.
        - name: window
          in: query
          schema:
            type: string
            enum: [today, 7d, 30d]
            default: 7d
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Activity feed payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  needs:
                    type: array
                    items:
                      type: object
                    description: Actionable events — one row per event requiring action (excludes dismissed/opened items).
                  seen:
                    type: array
                    items:
                      type: object
                    description: >-
                      Dismissed or opened Needs You events still within the selected
                      window/limit — shown in the notifications panel Seen tab.
                  pulse:
                    type: object
                    description: Aggregated ambient counts per kind over the selected window.
                  actionItems:
                    type: array
                    description: >-
                      Comments assigned to the signed-in user that are not yet resolved.
                      Each item is a Comment with `assigneeUserId`, `assigneeEmail`, and
                      optional `dueAt` set.
                    items:
                      type: object
                  requestedOpen:
                    type: integer
                    description: >-
                      Count of comments the signed-in user assigned to others that are
                      still open (unresolved).
  /v1/home/review:
    get:
      tags: [Home]
      summary: Review state of an artifact
      description: >-
        The live version, whether the caller may review (resolve, assign, approve) and
        every approval. The Home shell's endpoint; accepts a session cookie or a Bearer
        token. Comments themselves are read and resolved through the Data comments
        endpoints.
      operationId: getHomeReview
      parameters:
        - name: artifactId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: No access to this artifact
  /v1/home/approvals:
    post:
      tags: [Home]
      summary: Approve a version (or withdraw approval)
      description: >-
        Records that the caller approved a version — the live one unless `versionId` is
        given. Approvals are a record shown in History and Details, not a publish gate.
        Needs comment access (owner, collaborator, internal member of a workspace- or
        public-visible artifact, or a `comment` grant). The only REST path for
        approvals; session cookie or Bearer token.
      operationId: setHomeApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifactId]
              properties:
                artifactId:
                  type: string
                versionId:
                  type: string
                  description: A version id (`ver_…`); defaults to the live version.
                approved:
                  type: boolean
                  default: true
                  description: "`false` withdraws the caller's approval."
      responses:
        "200":
          description: Review state after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: "`FORBIDDEN` — you need comment access to approve"
        "404":
          description: "`NOT_FOUND` (artifact) or `VERSION_NOT_FOUND`"
  /v1/home/search-index:
    get:
      tags: [Home, Search]
      summary: Palette search index
      description: >-
        Compact index of everything the signed-in user can find by name in the scope
        (pages, folders, people), ranked locally by the Cmd+K palette. Same visibility
        as `/v1/search`; a non-member of `workspace` gets empty lists. Rows are
        positional arrays. Revalidate with `If-None-Match` for a `304`. `Server-Timing`
        carries `idx_build` and `idx_etag`.
      operationId: getHomeSearchIndex
      parameters:
        - name: workspace
          in: query
          schema:
            type: string
          description: Workspace id; omit for everything the user can see.
        - name: If-None-Match
          in: header
          schema:
            type: string
          description: ETag from a previous response.
      responses:
        "200":
          description: The index
          headers:
            ETag:
              schema:
                type: string
              description: Weak ETag of this user's index for this scope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  v:
                    type: integer
                    description: Format version (1).
                  truncated:
                    type: boolean
                    description: More than 3,000 pages; older ones are left to deep search.
                  artifacts:
                    type: array
                    description: "[id, slug, name, type ('' = html), folderId, tags (newline-joined), updatedSec, description (80 chars), flags (1 private, 2 thumbnail), ownerIdx, wsIdx]"
                    items:
                      type: array
                      items: {}
                  folders:
                    type: array
                    description: "[id, name, parentId ('' = top level), pageCount]"
                    items:
                      type: array
                      items: {}
                  people:
                    type: array
                    description: "[userId, name, email, picture, role]"
                    items:
                      type: array
                      items:
                        type: string
                  owners:
                    type: array
                    description: "[name, picture]"
                    items:
                      type: array
                      items:
                        type: string
                  workspaces:
                    type: array
                    description: "[id, name] when searching across workspaces"
                    items:
                      type: array
                      items:
                        type: string
                  recent:
                    type: array
                    description: Ids of pages the user opened last, newest first.
                    items:
                      type: string
        "304":
          description: Unchanged since the ETag in `If-None-Match`.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/home/deep-search:
    get:
      tags: [Home, Search]
      summary: Palette deep search
      description: >-
        What the local index cannot answer: pages whose description matches (`content`),
        Knowledge passages when the workspace has Knowledge (`passages`), and the
        datasets, connectors, schedules, crew, alerts and skills groups. Same
        visibility as `/v1/search`.
      operationId: getHomeDeepSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search text; under 2 characters returns empty groups, passages need 3.
        - name: workspace
          in: query
          schema:
            type: string
        - name: older
          in: query
          schema:
            type: string
            enum: ["1"]
          description: Also match names of pages past the index cap (send when the index was truncated).
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
            maximum: 20
          description: Max results per group.
      responses:
        "200":
          description: Grouped hits
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  content:
                    type: array
                    items:
                      type: object
                  passages:
                    type: array
                    description: "{ artifact: { id, title }, page, page_title, section, excerpt, url }"
                    items:
                      type: object
                  datasets:
                    type: array
                    items:
                      type: object
                  connectors:
                    type: array
                    items:
                      type: object
                  schedules:
                    type: array
                    items:
                      type: object
                  crew:
                    type: array
                    items:
                      type: object
                  alerts:
                    type: array
                    items:
                      type: object
                  skills:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/home/recent-searches:
    parameters:
      - name: workspace
        in: query
        schema:
          type: string
        description: Workspace id; omit for personal / all pages. Each scope keeps its own list.
    get:
      tags: [Home, Search]
      summary: List recent palette searches
      description: The signed-in user's last searches in the scope, newest first (max 20).
      operationId: listHomeRecentSearches
      responses:
        "200":
          $ref: "#/components/responses/RecentSearches"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Home, Search]
      summary: Record a palette search
      description: >-
        Records `q` as the newest search. A repeat (any case or accents) moves to the
        top; the list keeps 20.
      operationId: recordHomeRecentSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q:
                  type: string
                  maxLength: 200
      responses:
        "200":
          $ref: "#/components/responses/RecentSearches"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Home, Search]
      summary: Remove recent palette searches
      description: Removes the search `q`; without `q`, clears the scope.
      operationId: deleteHomeRecentSearches
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/RecentSearches"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/home/dismiss-event:
    post:
      tags: [Home]
      summary: Dismiss activity notifications
      description: >-
        Hide actionable Needs You events for the signed-in user. Used by the
        notifications panel (single dismiss, mark-all-read, or opening a card).
      operationId: dismissHomeEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [eventId]
                  properties:
                    eventId:
                      type: string
                - type: object
                  required: [eventIds]
                  properties:
                    eventIds:
                      type: array
                      items:
                        type: string
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/home/event-visibility:
    get:
      tags: [Home]
      summary: List activity visibility settings
      operationId: getHomeEventVisibility
      parameters:
        - name: workspace
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Per-kind audience map
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: array
                    items:
                      type: object
                  canManage:
                    type: boolean
                  scoped:
                    type: boolean
    put:
      tags: [Home]
      summary: Set activity visibility for one kind
      operationId: setHomeEventVisibility
      parameters:
        - name: workspace
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, audience]
              properties:
                kind:
                  type: string
                  description: Activity kind (e.g. view, comment, run).
                audience:
                  type: string
                  enum: [self, members, admins, off]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/home/onboarding:
    get:
      tags: [Home]
      summary: Setup checklist status
      description: >-
        Returns the signed-in user's onboarding checklist for a workspace, or
        `{ "track": null }` when no checklist applies (external sharees, established
        workspaces, or members who joined more than 14 days ago). Task labels are
        client-side; the server returns keys, done flags, and action hints.
      operationId: getHomeOnboarding
      parameters:
        - name: workspace
          in: query
          schema:
            type: string
          description: Workspace id or slug.
      responses:
        "200":
          description: Checklist status
          content:
            application/json:
              schema:
                type: object
                properties:
                  track:
                    type: string
                    nullable: true
                    enum: [admin, member, null]
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        done:
                          type: boolean
                        skippable:
                          type: boolean
                  pct:
                    type: integer
                    minimum: 0
                    maximum: 100
                  eligible:
                    type: boolean
                  dismissed:
