            schema:
              type: object
              properties:
                dailySync: { type: boolean }
                convert: { type: boolean }
      responses:
        "200":
          description: Updated
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [File imports]
      summary: Stop syncing a folder
      description: The creator or an admin. Imported files and pages stay.
      operationId: deleteFileImportSource
      responses:
        "200":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/workspaces/{workspaceId}/file-imports/sources/{sourceId}/sync:
    parameters:
