display_information:
  name: ShareOut
  description: Share and chat with your ShareOut pages in Slack.
  background_color: "#1a1a1a"
features:
  bot_user:
    display_name: ShareOut
    always_online: true
  slash_commands:
    - command: /shareout
      url: https://shareout.site/slack/commands
      description: Chat with your ShareOut pages
      usage_hint: "[help | artifacts | search …]"
      should_escape: false
oauth_config:
  redirect_urls:
    - https://shareout.site/v1/oauth/slack/callback
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - chat:write.customize
      - channels:read
      - groups:read
      - files:write
      - im:history
      - im:read
      - im:write
      - users:read
      - users:read.email
      - links:read
      - links:write
      - reactions:write
      - team:read
      - commands
settings:
  event_subscriptions:
    request_url: https://shareout.site/slack/events
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://shareout.site/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
