# ShareOut — OSS / Deploy-to-Cloudflare template
# No founder account IDs, routes, or zones. Placeholder D1/KV ids below are filled by
# `npm run provision:cf` (also runs from `npm run deploy`). Workers Builds does NOT
# rewrite them — always use deploy command `npm run deploy` with Root = shareout-app.
name = "shareout"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[dev]
host = "localhost"
local_protocol = "http"

[observability]
enabled = true

  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1

[vars]
LOG_LEVEL = "info"
TEAM_METRICS_ENABLED = "0"
# Opt-IN nurture mail. Leave "0" until you explicitly want activation/win-back/digests.
NURTURE_EMAILS_ENABLED = "0"
# Replace after first deploy with your workers.dev or custom domain origin
SHAREOUT_BASE_URL = "https://shareout.workers.dev"
# Optional: hostname of a separate marketing site to put in front of the app.
# Unset = anonymous `/` goes to the login page (no marketing site ships here).
# MARKETING_ORIGIN = "my-marketing.pages.dev"
# Optional: serve your own built docs-site on a hostname this worker owns.
# DOCS_HOST = "docs.example.com"
# DOCS_ORIGIN = "my-docs.pages.dev"
# Same-zone artifacts until you add a CDN domain
# ARTIFACT_ORIGIN = "https://shareout.workers.dev"
# Multilingual Knowledge index (KNOWLEDGE_VECTORS_V2 below). Model: @cf/baai/bge-m3 unless set;
# the other supported 1024-d model is @cf/qwen/qwen3-embedding-0.6b.
# KNOWLEDGE_EMBED_MODEL = "@cf/qwen/qwen3-embedding-0.6b"
# Searches read the multilingual index (per workspace, once backfilled; else the 768-d ones).
# KNOWLEDGE_VECTORS_READ = "v2"

# Optional Email / Queues / AI / Browser / Vectorize — uncomment after core boot.
# Deploy button stays leaner without them; product degrades (OTP→logs, no queue, keyword search).
# [[send_email]]
# name = "EMAIL"
#
# [[queues.producers]]
# queue = "shareout-analytics-views"
# binding = "VIEWS_QUEUE"
#
# [[queues.consumers]]
# queue = "shareout-analytics-views"
# max_batch_size = 100
# max_batch_timeout = 10
# max_retries = 3
# dead_letter_queue = "shareout-analytics-views-dlq"

[[d1_databases]]
binding = "DB"
database_name = "shareout-db"
# Placeholder — Deploy button / `wrangler d1 create` replaces this
database_id = "00000000-0000-0000-0000-000000000001"

# Optional presigned direct-to-R2 transfers: set the R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY /
# R2_ACCOUNT_ID secrets AND an R2_BUCKET var equal to this bucket_name (no default is guessed).
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "shareout-artifacts"

# [browser]
# binding = "BROWSER"

[version_metadata]
binding = "CF_VERSION_METADATA"

# [ai]
# binding = "AI"

# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "shareout-artifacts"

# Knowledge search over Files and pages. Create with:
#   wrangler vectorize create shareout-knowledge --dimensions=768 --metric=cosine
# [[vectorize]]
# binding = "KNOWLEDGE_VECTORS"
# index_name = "shareout-knowledge"

# Multilingual Knowledge search (Spanish ↔ English and paraphrases): one 1024-d index for
# passages, notes and workspace pages, one namespace per workspace. Create the index AND its
# three metadata indexes before binding it — Vectorize only indexes metadata of vectors
# written after a metadata index exists:
#   wrangler vectorize create shareout-knowledge-v2 --dimensions=1024 --metric=cosine
#   wrangler vectorize create-metadata-index shareout-knowledge-v2 --property-name=source_kind --type=string
#   wrangler vectorize create-metadata-index shareout-knowledge-v2 --property-name=source_id --type=string
#   wrangler vectorize create-metadata-index shareout-knowledge-v2 --property-name=embed_model --type=string
# Bound, it is written next to the 768-d indexes; searches move to it with
# KNOWLEDGE_VECTORS_READ = "v2" after the backfill (docs: self-host/ops, "Multilingual Knowledge search").
# [[vectorize]]
# binding = "KNOWLEDGE_VECTORS_V2"
# index_name = "shareout-knowledge-v2"

# Durable per-file knowledge ingest (without it, ingest runs inline after the request).
[[workflows]]
name = "shareout-knowledge-ingest"
binding = "KNOWLEDGE_INGEST"
class_name = "KnowledgeIngestWorkflow"

# Durable folder import from Google Drive / OneDrive / SharePoint (src/file-imports).
# Optional: without it imports run inline in waitUntil, which suits small folders only.
[[workflows]]
name = "shareout-file-import"
binding = "FILE_IMPORT"
class_name = "FileImportWorkflow"

[[kv_namespaces]]
binding = "SLUGS"
id = "00000000000000000000000000000001"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "00000000000000000000000000000002"

[[kv_namespaces]]
binding = "PROXY_CACHE"
id = "00000000000000000000000000000003"

[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeCoordinator"

[[durable_objects.bindings]]
name = "COMMENTS"
class_name = "CommentsCoordinator"

[[durable_objects.bindings]]
name = "MINIDB"
class_name = "MiniDB"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatDO"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceCoordinator"

[[durable_objects.bindings]]
name = "SHOWTIME"
class_name = "Showtime"

[[durable_objects.bindings]]
name = "KNOWLEDGE_STORE"
class_name = "KnowledgeStore"

# Durable AI page builds (src/build-jobs): one object per user runs that user's builds, so a
# build outlives the tab that started it and the user is told when it ends unwatched.
# Optional: without it a build runs inline in its request and dies with the tab.
[[durable_objects.bindings]]
name = "BUILD_JOBS"
class_name = "BuildJobs"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CommentsCoordinator"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MiniDB"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ChatDO"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["PresenceCoordinator"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["Showtime"]

[[migrations]]
tag = "v8"
new_sqlite_classes = ["KnowledgeStore"]

# Optional: slide decks (.pptx/.ppt/.odp) import as a PDF artifact, converted by LibreOffice
# in a Cloudflare Container (containers/slides/). Needs Workers Paid and Docker on the machine
# that runs `wrangler deploy` (it builds and pushes the image). Without it, decks stay in
# Assets and POST /v1/home/import answers 422 CONVERT_UNAVAILABLE. Uncomment all three.
# Already deployed v10 (BuildJobs, below)? Wrangler only applies tags after the deployed one:
# give this migration the next unused tag (v11) and move it after the last [[migrations]].
# [[containers]]
# class_name = "SlidesConverter"
# image = "./containers/slides/Dockerfile"
# instance_type = "standard-1"
# max_instances = 1
#
# [[durable_objects.bindings]]
# name = "SLIDES_CONVERTER"
# class_name = "SlidesConverter"
#
# [[migrations]]
# tag = "v9"
# new_sqlite_classes = ["SlidesConverter"]

# BuildJobs (above). A new class: deploy it with `wrangler deploy`, not `versions upload`.
[[migrations]]
tag = "v10"
new_sqlite_classes = ["BuildJobs"]

# Optional hourly cron — disable on free accounts if undesired
[triggers]
crons = ["0 * * * *"]
